.svg{width:16px;height:16px;flex:none}

.bar .spacer{flex:1}
.sel{display:flex;align-items:center;gap:8px}
.sel label{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
select,input[type=text],input[type=password],input[type=number],input[type=date],textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;min-height:36px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 13px;min-height:36px;font-weight:500;white-space:nowrap}

  setRoles:map=>F.setDoc(F.doc(db,"config/roles"),{map,updatedAt:new Date().toISOString()}),

const deny=err=>{setTimeout(()=>err&&err({code:"permission-denied"}),0);return()=>{}};
function quizDocRef(){const t=TK();return F.doc(db,t.col+"/"+t.id)}

  collection:p=>({onSnapshot:(cb,err)=>{

    get:async()=>wrap(await F.getDoc(F.doc(db,p))),
    set:d=>F.setDoc(F.doc(db,p),JSON.parse(JSON.stringify(d))),
    delete:()=>F.deleteDoc(F.doc(db,p))})

const rand32=()=>Array.from(crypto.getRandomValues(new Uint8Array(16))).map(x=>x.toString(16).padStart(2,"0")).join("");
const b64=blob=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=no;r.readAsDataURL(blob)});

  upload:async(blob,o)=>{const type=(o&&o.type)||blob.type||"image/jpeg",data=await b64(blob);

    await F.setDoc(F.doc(db,"photoData/"+id),{data,type,size:blob.size,at:new Date().toISOString(),by:FB.email});

let aiM=null;

  const models=[cfg.aiModel||"gemini-2.5-flash","gemini-flash-latest","gemini-2.0-flash"];let r=null,last=null;

    for(const m of (aiM?[aiM]:models)){try{const gm=AI.getGenerativeModel(ai,{model:m,generationConfig:{responseMimeType:"application/json",temperature:0.3}});r=await gm.generateContent(prompt);aiM=m;break}catch(e){last=e;if(!/not.?found|404|not supported/i.test(String(e&&e.message||e)))throw e}}
    if(!r)throw last;const t=r.response.text().trim().replace(/^```(?:json)?\s*/,"").replace(/```$/,"");return JSON.parse(t)}
  catch(e){aiM=null;const m=String(e&&e.message||e);console.warn("AI",m);throw{code:/AI Logic|firebasevertexai|not.?enabled|has not been used|disabled|SERVICE_DISABLED|api-not-enabled|PERMISSION_DENIED|403/i.test(m)?"not_enabled":/429|quota|RESOURCE_EXHAUSTED/i.test(m)?"rate_limited":"failed",message:m}}}};
const api={use:n=>n==="sample"?((FB.role==="admin"||FB.role==="editor")?sampleApi:null):n==="db"?dbApi:n==="downloads"?downloadsApi:n==="assets"?((FB.role==="admin"||FB.role==="editor")?assetsApi:null):null};
let done=false;
async function finish(u){
  FB.user=u;FB.anon=!u||u.isAnonymous;
  if(u&&!u.isAnonymous){FB.email=String(u.email||"").toLowerCase();FB.owner=!!owner&&FB.email===owner;
    let map={};try{const r=await F.getDoc(F.doc(db,"config/roles"));map=r.exists()?(r.data().map||{}):{}}catch(e){}

  if(done){const was=FB.user&&FB.user.uid,now=u&&u.uid;if(was!==now&&!(u&&u.isAnonymous&&taker()))location.reload();return}

<script>
/* ==== GA parser: shared between page and node test ==== */
var GA = (function () {
  function clean(v) {
    if (v == null) return "";
    return String(v).replace(/[ ‎​﻿]/g, " ").replace(/\s+/g, " ").trim();
  }
  function cleanId(v) { var s = clean(v); return s.replace(/\s/g, ""); }
  function keyOf(name, staff) {
    var id = cleanId(staff).replace(/[^0-9A-Za-z]/g, "");
    if (id && id !== "0") return "s" + id;
    return "n" + clean(name).toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 40);
  }
  function fmtDate(v) {
    if (v == null || v === "") return "";
    if (v instanceof Date && !isNaN(v)) {
      var d = new Date(v.getTime() + 12 * 3600e3); // guard TZ drift
      return d.toISOString().slice(0, 10);
    }
    var s = clean(v);
    var m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) { var a = +m[1], b = +m[2], mo = a > 12 ? b : (b > 12 ? a : b), dd = a > 12 ? a : (b > 12 ? b : a); return m[3] + "-" + ("0" + mo).slice(-2) + "-" + ("0" + dd).slice(-2); }
    return s;
  }
  function rows(XLSX, ws) {
    return XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: true });
  }
  var lastSheet = "";
  function findSheet(wb, words) {
    var meta = (wb.Workbook && wb.Workbook.Sheets) || [];
    var names = wb.SheetNames.filter(function (n, i) { return !(meta[i] && meta[i].Hidden); });
    var norm = function (n) { return n.toLowerCase().replace(/\s+/g, " ").trim(); };
    var tests = [function (n, w) { return norm(n) === w; }, function (n, w) { return norm(n).indexOf(w) === 0; }, function (n, w) { return norm(n).indexOf(w) >= 0; }];
    for (var t = 0; t < tests.length; t++)
      for (var w = 0; w < words.length; w++)
        for (var i = 0; i < names.length; i++)
          if (tests[t](names[i], words[w])) { lastSheet = names[i]; return wb.Sheets[names[i]]; }
    return null;
  }
  function headerInfo(R) {
    for (var r = 0; r < Math.min(R.length, 12); r++) {
      var row = R[r] || [];
      for (var c = 0; c < row.length; c++) {
        if (clean(row[c]).toLowerCase() === "name") {
          var info = { hr: r, name: c, staff: -1, station: -1 };
          for (var k = 0; k < row.length; k++) {
            var h = clean(row[k]).toLowerCase();
            if (info.staff < 0 && /staff/.test(h)) info.staff = k;
            if (info.station < 0 && /station|lokasi/.test(h)) info.station = k;
          }
          return info;
        }
      }
    }
    return null;
  }
  function personRows(R, info) {
    var out = [];
    for (var r = info.hr + 1; r < R.length; r++) {
      var row = R[r] || [];
      var nm = clean(row[info.name]);
      var wd = /\((withdraw\w*)\)/i.test(nm); nm = nm.replace(/\s*\((withdraw\w*)\)\s*/i, " ").trim();
      if (!nm || nm === "0" || /^total|^average|^module$/i.test(nm)) continue;
      var rawSt = info.staff >= 0 ? clean(row[info.staff]) : "", pos = "";
      if (/[A-Za-z]{3,}/.test(rawSt) && !/\d/.test(rawSt)) { pos = rawSt; rawSt = ""; }
      out.push({ r: r, row: row, wd: wd, name: nm, staff: rawSt ? cleanId(rawSt) : "", pos: pos, station: info.station >= 0 ? clean(row[info.station]) : "" });
    }
    return out;
  }
  var STATUS = { "attend": "P", "present": "P", "hadir": "P", "absent": "A", "tidak hadir": "A", "absent with reason": "R", "awr": "R", "excused": "R", "not started": "N", "-": "N" };
  function normStatus(v) {
    var s = clean(v).toLowerCase();
    if (!s) return null;
    if (STATUS[s]) return STATUS[s];
    if (/reason|cuti|mc/.test(s)) return "R";
    if (/absent/.test(s)) return "A";
    if (/attend|present|hadir/.test(s)) return "P";
    if (/not/.test(s)) return "N";
    return null;
  }

  function nkey(n) { return "n" + clean(n).toLowerCase().replace(/[^a-z0-9]/g, "").replace(/(.)\1+/g, "$1").slice(0, 40); }
  /* Merge helper: participant map keyed */
  function ensure(map, order, p) {
    var k = keyOf(p.name, p.staff);
    // try match by name if staff missing
    if (!map[k]) {
      var nk = nkey(p.name);
      for (var kk in map) {
        if (map[kk]._nk === nk) { k = kk; break; }
      }
    }
    if (!map[k]) {
      map[k] = { id: k, _nk: nkey(p.name), name: p.name, staffId: p.staff, station: p.station, position: p.pos || "", remark: "", att: {}, quiz: {}, trainer: {}, project: {} };
      order.push(k);
    } else {
      if (!map[k].staffId && p.staff) map[k].staffId = p.staff;
      if (!map[k].station && p.station) map[k].station = p.station;
      if (!map[k].position && p.pos) map[k].position = p.pos;
    }
    if (p.wd) map[k].remark = "Withdrawn";
    return map[k];
  }

  function parseWorkbook(XLSX, wb) {
    var map = {}, order = [], out = { sessions: [], quizModules: [], trainerTopics: [], projectCriteria: [], found: [] };

    // ---- Attendance
    var ws = findSheet(wb, ["attendance", "kehadiran"]);
    if (ws) {
      var R = rows(XLSX, ws), info = headerInfo(R);
      if (info) {
        var ppl = personRows(R, info), hdr = R[info.hr] || [], above = info.hr > 0 ? R[info.hr - 1] || [] : [];
        var maxC = 0; R.forEach(function (row) { if (row && row.length > maxC) maxC = row.length; });
        var cols = [];
        for (var c = 0; c < maxC; c++) {
          if (c === info.name || c === info.staff || c === info.station) continue;
          var hits = 0;
          ppl.forEach(function (p) { if (normStatus(p.row[c])) hits++; });
          if (hits > 0) cols.push(c);
        }
        var ff = [], lastD = "";
        for (var cf = 0; cf < maxC; cf++) { var av = above[cf]; if (av instanceof Date || /\d.*[\/\-].*\d/.test(clean(av))) lastD = av; else if (clean(av)) lastD = ""; ff[cf] = (av == null || av === "") ? lastD : (lastD === av ? av : ""); }
        cols.forEach(function (c, i) {
          out.sessions.push({ key: "a" + (i + 1), module: clean(hdr[c]) || ("Session " + (i + 1)), date: fmtDate(ff[c]) });
        });
        ppl.forEach(function (p) {
          var P = ensure(map, order, p);
          cols.forEach(function (c, i) { var s = normStatus(p.row[c]); if (s) P.att["a" + (i + 1)] = s; });
        });
        out.found.push("Attendance: " + cols.length + " sessions");
      }
    }
    // ---- Quiz
    ws = findSheet(wb, ["quiz", "kuiz", "forum understanding"]);
    if (ws) {
      var R2 = rows(XLSX, ws), info2 = headerInfo(R2);
      if (info2) {
        var ppl2 = personRows(R2, info2), hdr2 = R2[info2.hr] || [], ab2 = info2.hr > 0 ? R2[info2.hr - 1] || [] : [];
        var start = Math.max(info2.name, info2.staff, info2.station) + 1;
        var qcols = [];
        for (var c3 = start; c3 < hdr2.length; c3++) {
          if (!clean(hdr2[c3])) continue;
          if (/^(total|range|avg|average|marks?|high|%)/i.test(clean(hdr2[c3]))) continue;
          if (/^column\d+$/i.test(clean(hdr2[c3]))) continue;
          var any = ppl2.some(function (p) { return typeof p.row[c3] === "number"; });
          if (any) qcols.push(c3);
        }
        qcols.forEach(function (c, i) { out.quizModules.push({ key: "q" + (i + 1), module: clean(hdr2[c]), date: fmtDate(ab2[c]) }); });
        ppl2.forEach(function (p) {
          var P = ensure(map, order, p);
          qcols.forEach(function (c, i) {
            var v = p.row[c];
            if (typeof v === "number") { if (v > 1.0001) v = v / 100; P.quiz["q" + (i + 1)] = Math.round(v * 1000) / 1000; }
          });
        });
        out.found.push("Quizzes: " + qcols.length);
      }
    }
    // ---- Trainer / skill assessment (trainer marks out of 20, or core traits 1-5)
    ws = findSheet(wb, ["trainer assessment", "trainer", "skill assessment", "skill"]);
    if (ws) {
      var isTrainer = /trainer/i.test(lastSheet), sheetName = lastSheet;
      var R3 = rows(XLSX, ws), info3 = headerInfo(R3);
      if (info3) {
        var ppl3 = personRows(R3, info3), hdr3 = R3[info3.hr] || [], tcols = [], mx3 = 0;
        var st3 = Math.max(info3.name, info3.staff, info3.station) + 1;
        for (var c5 = st3; c5 < hdr3.length; c5++) {
          var h3 = clean(hdr3[c5]);
          if (!h3 || /^(total|average|marks?|range|remark|high|grand)/i.test(h3) || /^column\d+$/i.test(h3)) continue;
          var has = ppl3.some(function (p) { return typeof p.row[c5] === "number" && p.row[c5] > 0; });
          if (has || isTrainer) tcols.push(c5);
        }
        tcols.forEach(function (c, i) { out.trainerTopics.push({ key: "t" + (i + 1), module: h3 = clean(hdr3[c]) }); });
        ppl3.forEach(function (p) {
          var P = ensure(map, order, p);

        });
        if (!isTrainer || (mx3 > 0 && mx3 <= 5)) { out.skillMax = (/1\s*-\s*5/.test(sheetName) || (mx3 > 0 && mx3 <= 5)) ? 5 : (mx3 > 0 && mx3 <= 10 ? 10 : 20); }
        if (tcols.length) out.found.push((isTrainer ? "Trainer modules: " : "Skill traits: ") + tcols.length + (out.skillMax ? " (scale 1–" + out.skillMax + ")" : ""));
      }
    }
    // ---- Project (1-3 scale)
    ws = findSheet(wb, ["project", "projek"]);
    if (ws) {
      var R4 = rows(XLSX, ws), info4 = headerInfo(R4);
      if (info4) {
        var ppl4 = personRows(R4, info4), hdr4 = R4[info4.hr] || [];
        var pcols = [];
        for (var c6 = 0; c6 < hdr4.length; c6++) {
          var h4 = clean(hdr4[c6]);
          if (/\d[A-Z]\s*\.+/.test(h4) && !/^remark/i.test(h4)) pcols.push(c6);
        }
        pcols.forEach(function (c, i) { out.projectCriteria.push({ key: "p" + (i + 1), module: clean(hdr4[c]).replace(/^[A-Z](?=\d)/, "").replace(/\.\.+/, ".") }); });
        ppl4.forEach(function (p) {
          var P = ensure(map, order, p);
          pcols.forEach(function (c, i) { var v = p.row[c]; if (typeof v === "number" && v > 0) P.project["p" + (i + 1)] = v; });
        });
        var anyPj = ppl4.some(function (p) { return pcols.some(function (c) { return typeof p.row[c] === "number" && p.row[c] > 0; }); });
        var avc = -1; for (var c7 = 0; c7 < hdr4.length; c7++) if (/^average/i.test(clean(hdr4[c7]))) { avc = c7; break; }
        if (!anyPj && avc >= 0 && ppl4.some(function (p) { return typeof p.row[avc] === "number" && p.row[avc] > 0; })) {

          ppl4.forEach(function (p) { var P = ensure(map, order, p); P.project = {}; var v = p.row[avc]; if (typeof v === "number" && v > 0) P.project.p1 = Math.round(v * 1000) / 1000; });

      }
    }
    // ---- Name list (optional: position)
    ws = findSheet(wb, ["name list", "senarai nama"]);
    if (ws && order.length === 0) {
      var R5 = rows(XLSX, ws), info5 = headerInfo(R5);
      if (info5) personRows(R5, info5).forEach(function (p) { ensure(map, order, p); });
    }
    // ---- Fallback: any sheet with Name column → participants
    if (order.length === 0) {
      wb.SheetNames.forEach(function (n) {
        var Rx = rows(XLSX, wb.Sheets[n]), ix = headerInfo(Rx);
        if (ix) personRows(Rx, ix).forEach(function (p) { ensure(map, order, p); });
      });
      if (order.length) out.found.push("Participant list");
    }
    out.participants = order.map(function (k, i) { var P = map[k]; delete P._nk; P.no = i + 1; return P; });
    return out;
  }

  /* ---- scoring ---- */
  function avg(a) { return a.length ? a.reduce(function (s, x) { return s + x; }, 0) / a.length : null; }

    var att = P.att || {}, n = { P: 0, A: 0, R: 0, N: 0 };
    Object.keys(att).forEach(function (k) { if (n[att[k]] != null) n[att[k]]++; });
    var held = n.P + n.A + n.R;
    var attRate = held ? n.P / held : null;
    var q = avg(vals(P.quiz));
    var t = avg(vals(P.trainer).filter(function (v) { return v > 0; }));
    var pj = avg(vals(P.project).filter(function (v) { return v > 0; }));
    var comp = {
      att: attRate == null ? null : attRate * w.att,
      quiz: q == null ? null : q * w.quiz,
      skill: t == null ? null : (t / (cohort.skillMax || 20)) * w.skill,
      project: pj == null ? null : (pj / 3) * w.project
    };

    var pass = cohort.passMark != null ? cohort.passMark : 65;
    return { counts: n, held: held, attRate: attRate, quizAvg: q, trainerAvg: t, projectAvg: pj, comp: comp, total: total, pass: total >= pass };
  }
  return { parseWorkbook: parseWorkbook, score: score, clean: clean, keyOf: keyOf, normStatus: normStatus, fmtDate: fmtDate };
})();

/* ---------- scoring & aggregates ---------- */
const weights=c=>c.weights||{att:20,quiz:20,skill:10,project:50};
const passMark=c=>c.passMark!=null?c.passMark:65;
const SKM=c=>(c&&c.skillMax)||20;
const norm=(ds,v)=>ds==="trainer"?v/SKM(S.cohorts[S.current]):ds==="project"?v/3:v;
function scoreP(c,p){const s=GA.score(p,{weights:weights(c),passMark:passMark(c),skillMax:SKM(c)});s.p=p;return s}
const STC=new WeakMap();
function stats(c){
  if(STC.has(c))return STC.get(c);
  const rows=(c.participants||[]).map(p=>scoreP(c,p)),n=rows.length;
  let P=0,H=0;rows.forEach(r=>{P+=r.counts.P;H+=r.held});
  const started={att:rows.some(r=>r.attRate!=null),quiz:rows.some(r=>r.quizAvg!=null),skill:rows.some(r=>r.trainerAvg!=null),project:rows.some(r=>r.projectAvg!=null)};
  const v={rows,n,avg:n?avg(rows.map(r=>r.total)):null,pass:rows.filter(r=>r.pass).length,attRate:H?P/H:null,
    quizAvg:avg(rows.filter(r=>r.quizAvg!=null).map(r=>r.quizAvg)),started,
    assessed:n?(rows.filter(r=>r.trainerAvg!=null).length+rows.filter(r=>r.projectAvg!=null).length)/(2*n):0};
  STC.set(c,v);
  return v;
}
function status(c,r){
  const st=stats(c).started;
  if(r.pass)return{k:"pass",label:"Pass",cls:"good"};
  if(!st.project||!st.skill)return{k:"prog",label:"In progress",cls:"warn"};
  return{k:"fail",label:"Below pass mark",cls:"bad"};
}
const pill=s=>'<span class="pill '+s.cls+'">'+s.label+'</span>';
function sessionAgg(c){
  return (c.sessions||[]).map(col=>{const n={P:0,A:0,R:0,N:0};(c.participants||[]).forEach(p=>{const v=(p.att||{})[col.key];if(v&&n[v]!=null)n[v]++});const held=n.P+n.A+n.R;return{col,n,held,rate:held?n.P/held:null}});
}
function colAgg(c,ds){
  const D=DS[ds];
  return (c[D.list]||[]).map(col=>{const vals=(c.participants||[]).map(p=>(p[D.field]||{})[col.key]).filter(v=>typeof v==="number"&&(ds==="quiz"||v>0));const a=avg(vals);return{col,n:vals.length,avg:a,norm:a==null?null:norm(ds,a)}});
}
function partAvg(c,ds,p){
  const D=DS[ds];const vals=(c[D.list]||[]).map(col=>(p[D.field]||{})[col.key]).filter(v=>typeof v==="number"&&(ds==="quiz"||v>0));const a=avg(vals);return a==null?null:norm(ds,a);
}
function bands(values){ // normalized 0..1
  const B=[["Excellent · 90–100%",.9,2],["Good · 75–89%",.75,.9],["Fair · 60–74%",.6,.75],["Low · below 60%",-1,.6]];
  return B.map((b,i)=>({label:b[0],value:values.filter(v=>v>=b[1]&&v<b[2]).length,color:SEQ[3-i]}));
}
function parseRange(s){
  s=String(s||"").trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m){const d=Date.UTC(+m[1],+m[2]-1,+m[3]);return[d,d]}
  m=s.match(/^(\d{1,2})\s*[-–]\s*(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m)return[Date.UTC(+m[4],+m[3]-1,+m[1]),Date.UTC(+m[4],+m[3]-1,+m[2])];
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m){const d=Date.UTC(+m[3],+m[2]-1,+m[1]);return[d,d]}
  return null;
}

/* ---------- chart primitives ---------- */
function hbars(items,o={}){

  return '<div class="hlist">'+items.map(i=>'<div class="hrow'+(i.act?' click" '+i.act+'':'"')+' data-tip="'+esc(i.tip||(i.label+": "+(i.text||i.value)))+'"><div class="l"><b>'+esc(i.label)+'</b>'+(i.sub?'<small>'+esc(i.sub)+'</small>':'')+'</div><div class="t"><i style="width:'+(i.value==null?0:Math.max(0,i.value)/max*100)+'%;background:var('+(i.color||o.color||"--s1")+')"></i></div><span class="v num">'+esc(i.text!=null?i.text:i.value)+'</span></div>').join("")+'</div>';
}
function columns(items,o={}){

}
function donut(items,o={}){
  items=items.filter(i=>i.value>0);
  const total=items.reduce((a,i)=>a+i.value,0);
  if(!total)return emptyChart(o.empty);
  const cx=95,cy=95,R=88,r=58;let a=-Math.PI/2,paths="";
  items.forEach(i=>{let sweep=i.value/total*Math.PI*2;if(sweep>=Math.PI*2)sweep=Math.PI*2-1e-4;const a1=a+sweep,L=sweep>Math.PI?1:0;
    const p=(rad,ang)=>(cx+rad*Math.cos(ang)).toFixed(2)+","+(cy+rad*Math.sin(ang)).toFixed(2);
    paths+='<path d="M'+p(R,a)+" A"+R+","+R+" 0 "+L+" 1 "+p(R,a1)+" L"+p(r,a1)+" A"+r+","+r+" 0 "+L+" 0 "+p(r,a)+' Z"'+(i.act?' class="click" '+i.act:'')+' style="fill:var('+i.color+')" data-tip="'+esc(i.label+": "+i.value+" ("+Math.round(i.value/total*100)+"%)")+'"></path>';a=a1});
  return '<div class="donut"><svg viewBox="0 0 190 190" role="img" aria-label="'+esc(o.aria||"Donut chart")+'">'+paths+'<text class="ct" x="95" y="98" text-anchor="middle">'+esc(o.center!=null?o.center:total)+'</text><text class="cl" x="95" y="118" text-anchor="middle">'+esc(o.centerLabel||"TOTAL")+'</text></svg>'+
    '<div class="dleg">'+items.map(i=>'<div'+(i.act?' class="click" '+i.act:'')+' data-tip="'+esc(i.label)+'"><i style="background:var('+i.color+')"></i><span>'+esc(i.label)+'</span><b class="num">'+i.value+'</b><em class="num">'+Math.round(i.value/total*100)+'%</em></div>').join("")+'</div></div>';
}
function lineChart(items,o={}){
  const pts=items.filter(i=>i.value!=null);
  if(!pts.length)return emptyChart(o.empty);
  const W=680,H=250,L=40,Rp=14,T=14,B=58,iw=W-L-Rp,ih=H-T-B,n=items.length;
  const x=i=>L+(n<=1?iw/2:i/(n-1)*iw),y=v=>T+ih-(v/(o.max||1))*ih;
  let g="";[0,.25,.5,.75,1].forEach(t=>{const yy=y(t*(o.max||1));g+='<line class="gl" x1="'+L+'" x2="'+(W-Rp)+'" y1="'+yy+'" y2="'+yy+'"/><text class="tx" x="'+(L-6)+'" y="'+(yy+4)+'" text-anchor="end">'+(o.fmtAxis?o.fmtAxis(t*(o.max||1)):Math.round(t*100)+"%")+'</text>'});
  const step=Math.max(1,Math.ceil(n/14));

  let d="",area="",first=null,last=null;

  if(first!=null)area=d+" L"+x(last).toFixed(1)+","+(T+ih)+" L"+x(first).toFixed(1)+","+(T+ih)+" Z";
  const col=o.color||"--s1";
  let dots="";items.forEach((it,i)=>{if(it.value==null)return;dots+='<circle class="hit" cx="'+x(i)+'" cy="'+y(it.value)+'" r="11" data-tip="'+esc(it.tip||it.label)+'"/><circle class="pt'+(i===last?" end":"")+'" cx="'+x(i)+'" cy="'+y(it.value)+'" r="'+(i===last?5.5:3.6)+'" style="fill:var('+col+')" pointer-events="none"/>'});
  return '<svg class="lchart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria||"Line chart")+'">'+g+'<path class="ar" d="'+area+'" style="fill:var('+col+')"/><path class="ln" d="'+d+'" style="stroke:var('+col+')"/>'+dots+'</svg>';
}
function emptyChart(msg){return '<div class="empty" style="padding:22px"><b>No data yet</b>'+esc(msg||"This chart fills in once results are recorded.")+'</div>'}
function rateColor(v){return v==null?"--none":v>=.9?"--good":v>=.75?"--s1":v>=.6?"--warn":"--bad"}
function ganttChart(c){
  const agg=sessionAgg(c),groups=[],idx={};let undated=0,mn=Infinity,mx=-Infinity;
  agg.forEach(a=>{const r=parseRange(a.col.date);if(!r){undated++;return}mn=Math.min(mn,r[0]);mx=Math.max(mx,r[1]);
    const k=String(a.col.module).toLowerCase().replace(/[^a-z0-9]/g,"");if(idx[k]==null){idx[k]=groups.length;groups.push({label:a.col.module,bars:[]})}groups[idx[k]].bars.push({r,a})});
  if(!groups.length)return emptyChart("Add dates to sessions to see the programme timeline.");

  groups.forEach(g=>{h+='<div class="grow2"><span class="gl2" title="'+esc(g.label)+'">'+esc(g.label)+'</span><div class="gtrack">'+lines+today+g.bars.map(b=>{const w=Math.max(.6,X(b.r[1]+DAY)-X(b.r[0]));return '<span class="gb click" data-reg="'+b.a.col.key+'" style="left:'+X(b.r[0])+'%;width:'+w+'%;background:var('+rateColor(b.a.rate)+')" data-tip="'+esc(b.a.col.module+"\n"+fmtD(b.a.col.date)+"\nPresent "+b.a.n.P+" of "+b.a.held+(b.a.rate!=null?" ("+pc(b.a.rate)+")":""))+'"></span>'}).join("")+'</div></div>'});
  h+='</div><div class="legend" style="margin-top:10px"><span><i style="background:var(--good)"></i>≥90% present</span><span><i style="background:var(--s1)"></i>75–89%</span><span><i style="background:var(--warn)"></i>60–74%</span><span><i style="background:var(--bad)"></i>&lt;60%</span><span><i style="background:var(--accent);width:2px"></i>Today</span></div>';
  if(undated)h+='<p class="note">'+plural(undated,"session has","sessions have")+' no recognisable date and '+(undated===1?"is":"are")+' not shown.</p>';

}
function heatmap(c,ds){

      else{const nv=v==null||(ds!=="quiz"&&v===0)?null:norm(ds,v);bg=nv==null?"--surface-2":rateColor(nv);t=v==null?"No score":(ds==="quiz"?pc(v):v+(ds==="trainer"?" / "+SKM(c):" / 3"))}

function stackedScores(c,limit){

    h+='<div class="srow" data-tip="'+esc(tip)+'"><button class="nm" data-person="'+esc(r.p.id)+'">'+esc(r.p.name)+'</button><div class="track">'+comps.map(x=>{const v=r.comp[x[0]]||0;return v>0?'<span class="seg" style="width:'+v+'%;background:var('+x[3]+')"></span>':""}).join("")+'<span class="mark" style="left:'+pm+'%"></span></div><span class="tv num">'+r.total.toFixed(1)+'</span></div>'});

function pAtt(c,full){

      return hbars(agg.map(a=>({label:a.col.module,sub:a.n+" scored"+(a.col.date?" · "+fmtD(a.col.date):"")+(a.col.trainer?" · "+a.col.trainer:""),value:a.norm,max:1,text:fmt(a),color:rateColor(a.norm),act:'data-coldetail="'+ds+'|'+a.col.key+'"',tip:a.col.module+"\nAverage "+fmt(a)+(ds==="quiz"?"":scale)+"\n"+a.n+" scored"})),{max:1,color:D.color});

async function boot(){
  render();
  const cl=window.claude;
  if(!cl||!cl.use){setSync("Offline: database not available");S.loaded=true;render();return}
  try{S.db=await cl.use("db")}catch(e){S.db=null}
  if(!S.db){setSync("Database not available in this view");S.loaded=true;render();return}
  S.db.collection("cohorts").onSnapshot(snap=>{
    const m={};snap.docs.forEach(d=>{if(d.exists)m[d.id]=d.data()});
    Object.keys(S.pending).forEach(id=>{if(S.pending[id])m[id]=S.pending[id]});
    const first=!S.loaded;S.cohorts=m;S.loaded=true;setSync("Synced · "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}));
    if(first)S.anim=true;safeRender();
  },e=>{setSync("Connection error ("+e.code+")");S.loaded=true;render()});
  subscribeHistory();subscribePhotos();subscribeExt();
  subscribeUsers();
  subscribeQuizzes();
  S.db.doc("config/admin").onSnapshot(d=>{S.auth=d.exists?d.data():null;S.authLoaded=true},()=>{S.authLoaded=true});
}
function setSync(t){const e=$("#syncState");if(e)e.textContent=t}
function queueSave(c,msg){
  c=clone(c);
  if(msg){c.log=c.log||[];c.log.unshift({t:new Date().toISOString(),by:S.admin||"admin",msg});c.log=c.log.slice(0,60)}
  c.updatedAt=new Date().toISOString();c.updatedBy=S.admin||"admin";
  S.pending[c.id]=c;S.cohorts[c.id]=c;
  clearTimeout(queueSave["t"+c.id]);queueSave["t"+c.id]=setTimeout(()=>flush(c.id),450);
}
async function flush(id){
  if(S.writing[id]){setTimeout(()=>flush(id),300);return}
  const c=S.pending[id];if(!c)return;
  if(!S.db){toast("Database not available. Changes cannot be saved here.");return}
  S.writing[id]=true;setSync("Saving…");
  try{await S.db.doc("cohorts/"+id).set(c);if(S.pending[id]===c)delete S.pending[id];setSync("Saved · "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}))}
  catch(e){delete S.pending[id];setSync("Save failed");toast(e&&e.code==="invalid_argument"?"Your account cannot write data. Ask the portal owner for Contributor or Editor access.":e&&e.code==="quota_exceeded"?"Database storage is full.":"Could not save. Please try again.")}
  S.writing[id]=false;
}

  const cvr=phCover(c.id);let h='<section class="banner'+(cvr?' hascover':'')+'"'+(cvr?' style="--cover:url(\''+phSrc(cvr)+'\')"':'')+'><span class="ga"><img alt="Genco Academy" src="'+LOGO_GA+'"></span><div class="grow"><span class="bk">'+esc(c.title||"SME Foundation Programme")+'</span><h1>'+esc(c.name||c.id)+' Participant Assessment</h1>'+
    '<div class="meta">'+(c.period?'<span>'+esc(c.period)+'</span>':'')+'<span>'+plural((c.participants||[]).length,"participant","participants")+'</span><span>'+plural(ses,"session","sessions")+'</span><span>'+plural((c.quizModules||[]).length,"quiz","quizzes")+'</span><span>'+plural((c.trainerTopics||[]).length,"trainer module","trainer modules")+'</span>'+(c.updatedAt?'<span>Updated '+esc(new Date(c.updatedAt).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}))+'</span>':'')+'</div></div>'+
    '<div class="acts"><button class="btn onban" data-act="export">'+I.down+' Export Excel</button><button class="btn onban solid" data-act="importto">'+I.up+' Import data</button></div></section>';
  h+='<div class="kpis k7">'+
    kpi("Participants",s.n,"",stationCounts(c).length+" stations","--s5",NAV[1][3],null,"people")+
    kpi("Average score",s.avg==null?"–":s.avg.toFixed(1),"%","Out of 100%","--s4",'<path d="M4 20V10M10 20V4M16 20v-7"/>',s.avg==null?null:s.avg/100,"people")+
    kpi("Passed (≥"+passMark(c)+"%)",s.pass,"/"+s.n,s.started.project?"Eligible for certification":"Project not yet assessed","--good",'<circle cx="12" cy="9" r="5"/><path d="M8.5 13l-1.5 8 5-3 5 3-1.5-8"/>',s.n?s.pass/s.n:0,"people")+
    kpi("Attendance rate",s.attRate==null?"–":(s.attRate*100).toFixed(1),"%","Present ÷ sessions held","--s1",NAV[2][3],s.attRate,"att")+
    kpi("Quiz average",s.quizAvg==null?"–":(s.quizAvg*100).toFixed(1),"%","Forum understanding","--s2",NAV[3][3],s.quizAvg,"quiz")+
    (()=>{const ps=c.participants||[],ck='<path d="M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>';
      const done=(ds,fld)=>{const cols=c[DS[ds].list]||[],tot=ps.length*cols.length;let f=0;ps.forEach(p=>cols.forEach(col=>{const v=(p[fld]||{})[col.key];if(typeof v==="number"&&v>0)f++}));const a=avg(ps.map(p=>partAvg(c,ds,p)).filter(v=>v!=null));return{r:tot?f/tot:null,a,cols:cols.length}};
      const t=done("trainer","trainer"),pj=done("project","project");
      return kpi("Trainer assessed",t.r==null?"–":Math.round(t.r*100),t.r==null?"":"%",t.cols?(t.a==null?"No marks yet":"Average "+(t.a*100).toFixed(0)+"% ("+(t.a*SKM(c)).toFixed(1)+" / "+SKM(c)+")"):"No modules set up","--s3",ck,t.r,"trainer")+
        kpi("Project assessed",pj.r==null?"–":Math.round(pj.r*100),pj.r==null?"":"%",pj.cols?(pj.a==null?"No ratings yet":"Average "+(pj.a*100).toFixed(0)+"% ("+(pj.a*3).toFixed(2)+" / 3)"):"No criteria set up","--s6",ck,pj.r,"project")})()+'</div>';
  const t=S.tab;
  h+='<div class="mtabs">'+NAV.filter(n=>!n[4]||S.admin).map(n=>'<button class="tab" data-tab="'+n[0]+'" aria-selected="'+(t===n[0])+'">'+n[1]+'</button>').join("")+'</div>';
  if(t==="people")h+=peopleTab(c);
  else if(DS[t])h+=dataTab(c,t);
  else if(t==="photos")h+=photosTab(c);
  else if(t==="settings"&&S.admin)h+=settingsTab(c);
  else if(t==="log"&&S.admin)h+=logTab(c);
  else h+=overviewTab(c);
  return h;
}
function kpi(l,v,suf,em,col,ico,meter,tab){return '<button class="kpi" style="--k:var('+col+')" data-tab="'+tab+'"><div class="kh"><span>'+l+'</span><i class="ic">'+navIco(ico)+'</i></div><b class="num">'+v+(suf?'<small>'+suf+'</small>':'')+'</b><em>'+em+'</em>'+(meter!=null?'<div class="meter"><i style="width:'+Math.max(0,Math.min(1,meter))*100+'%"></i></div>':'')+'</button>'}
function overviewTab(c){
  if(!(c.participants||[]).length)return startEmpty(c);
  return '<div class="g2 wide">'+pFinal(c)+pStation(c)+'</div>'+pHighlights(c)+
    '<div class="g2">'+pAtt(c)+pScores(c,"quiz")+'</div><div class="g2">'+pScores(c,"trainer")+pScores(c,"project")+'</div>';
}
function startEmpty(c){
  return '<div class="empty" style="padding:36px"><b>'+esc(c.name||c.id)+' has no participants yet</b>Import the participant assessment Excel, or add participants, sessions, quizzes and trainer modules by hand.<div class="acts"><button class="btn primary" data-act="importto">'+I.up+' Import data</button><button class="btn" data-act="addperson">'+I.plus+' Add participants</button><button class="btn" data-manage="att">'+I.list+' Set up sessions</button><button class="btn" data-manage="quiz">'+I.list+' Set up quizzes</button><button class="btn" data-manage="trainer">'+I.list+' Set up trainer modules</button></div></div>'+((c.trainerTopics||[]).length||(c.projectCriteria||[]).length?'<div class="g2">'+pScores(c,"trainer")+pScores(c,"project")+'</div>':'');
}

    '<button class="btn" data-act="importto">'+I.up+' Import</button><button class="btn primary" data-act="addperson">'+I.plus+' Add participants</button></div>';
  h+='<div class="tblwrap"><table><thead><tr><th>#</th>'+th("name","Participant")+th("station","Station")+th("att","Attendance "+w.att+"%","r")+th("quiz","Quiz "+w.quiz+"%","r")+th("skill","Skill "+w.skill+"%","r")+th("project","Project "+w.project+"%","r")+th("total","Total","r")+'<th>Status</th>'+(S.admin?'<th class="r">Actions</th>':'')+'</tr></thead><tbody>';
  rows.forEach((r,i)=>{
    h+='<tr><td class="num">'+(i+1)+'</td><td><button class="linkish who" data-person="'+esc(r.p.id)+'"><b>'+esc(r.p.name)+'</b><small>'+esc(r.p.staffId||"—")+(r.p.position?" · "+esc(r.p.position):"")+(r.p.remark?" · "+esc(r.p.remark):"")+'</small></button></td><td>'+esc(r.p.station||"—")+'</td>'+
      '<td class="r num">'+f1(r.comp.att)+bar(r.comp.att,w.att,"--s1")+'</td><td class="r num">'+f1(r.comp.quiz)+bar(r.comp.quiz,w.quiz,"--s2")+'</td><td class="r num">'+f1(r.comp.skill)+bar(r.comp.skill,w.skill,"--s3")+'</td><td class="r num">'+f1(r.comp.project)+bar(r.comp.project,w.project,"--s4")+'</td>'+
      '<td class="r num rowsum">'+r.total.toFixed(1)+'%</td><td>'+pill(status(c,r))+'</td>'+
      (S.admin?'<td><div class="rowacts"><button class="btn sm icon ghost" data-person="'+esc(r.p.id)+'" aria-label="Edit '+esc(r.p.name)+'" data-tip="Edit">'+I.edit+'</button><button class="btn sm icon ghost danger" data-delp="'+esc(r.p.id)+'" aria-label="Remove '+esc(r.p.name)+'" data-tip="Remove">'+I.trash+'</button></div></td>':'')+'</tr>'});

function cellColor(v){if(v==null)return "";return 'background:var('+rateColor(v)+');color:#fff'}
const ST_OPTS=[["","—"],["P","Present"],["A","Absent"],["R","Excused"],["N","Not started"]];
function stSelect(pid,key,v,big){return '<select class="stsel '+(v||"E")+(big?" big":"")+'" data-att="'+esc(pid)+'|'+key+'" aria-label="Attendance">'+ST_OPTS.map(o=>'<option value="'+o[0]+'"'+((v||"")===o[0]?" selected":"")+'>'+o[1]+'</option>').join("")+'</select>'}
function registerPanel(c){
  const ses=c.sessions||[];if(!ses.length)return "";
  let key=S.regSession&&ses.some(x=>x.key===S.regSession)?S.regSession:null;
  if(!key){const agg=sessionAgg(c);const lastHeld=agg.filter(a=>a.held>0).pop();key=(lastHeld||agg[0]).col.key}
  const col=ses.find(x=>x.key===key),ps=c.participants||[],n={P:0,A:0,R:0,N:0,E:0};
  ps.forEach(p=>{const v=(p.att||{})[key];n[v||"E"]++});
  let h='<section class="panel" id="register"><div class="ph"><div class="t"><div class="tag"><i style="background:var(--s1)"></i>Attendance</div><h3>Session register</h3><p>Choose a session, then set each participant’s attendance from the dropdown.</p></div><div class="a">'+
    '<label class="viewsel"><span>Session</span><select id="regSel" aria-label="Session">'+ses.map((x,i)=>'<option value="'+x.key+'"'+(x.key===key?" selected":"")+'>'+(i+1)+'. '+esc(short(x.module,38))+(x.date?" · "+esc(fmtD(x.date)):"")+'</option>').join("")+'</select></label></div></div>';
  h+='<div class="chips"><span class="chip" style="--k:var(--good)"><b class="num">'+n.P+'</b>Present</span><span class="chip" style="--k:var(--bad)"><b class="num">'+n.A+'</b>Absent</span><span class="chip" style="--k:var(--warn)"><b class="num">'+n.R+'</b>Excused</span><span class="chip" style="--k:var(--none)"><b class="num">'+n.N+'</b>Not started</span><span class="chip" style="--k:var(--line-2)"><b class="num">'+n.E+'</b>Not recorded</span><span class="grow"></span>'+
    (S.admin?'<button class="btn sm" data-markall="P">Mark all present</button><button class="btn sm" data-markall="N">Mark all not started</button><button class="btn sm ghost" data-markall="">Clear</button>':'')+'</div>';
  h+='<div class="reglist">'+ps.map((p,i)=>{const v=(p.att||{})[key];return '<div class="regrow"><span class="ix num">'+(i+1)+'</span><button class="linkish who" data-person="'+esc(p.id)+'"><b>'+esc(p.name)+'</b><small>'+esc(p.station||"")+'</small></button>'+(S.admin?stSelect(p.id,key,v,true):'<span class="pill '+({P:"good",A:"bad",R:"warn",N:"none"}[v]||"none")+'">'+(ST_LABEL[v]||"Not recorded")+'</span>')+'</div>'}).join("")+'</div>';
  if(col&&!S.admin)h+='<p class="note">Sign in as admin to change attendance.</p>';
  return h+'</section>';
}
function dataTab(c,ds){
  const D=DS[ds],cols=c[D.list]||[],ps=c.participants||[],adm=!!S.admin;if(ds==="trainer"||ds==="project")stdAuto(c);
  let h=ds==="att"?pAtt(c,true)+registerPanel(c):pScores(c,ds,true);
  const desc={att:adm?"Each cell is a dropdown: Present, Absent, Excused or Not started.":"Present · Absent · Excused · Not started",quiz:"Scores in % (0–100).",trainer:"Trainer marks per module, out of "+SKM(c)+".",project:"Ratings per criterion on a 1–3 scale."}[ds];
  h+='<div class="tools"><div><b style="font-family:var(--f-display);font-size:16px">'+({att:"Attendance register (all sessions)",quiz:"Quiz scores",trainer:"Trainer module marks",project:"Project ratings"}[ds])+'</b><div class="hint">'+plural(cols.length,D.item,D.items)+' · '+desc+'</div></div><span class="grow"></span>';
  if(ds==="att")h+='<div class="legend"><span><span class="st P">P</span> Present</span><span><span class="st A">A</span> Absent</span><span><span class="st R">E</span> Excused</span><span><span class="st N">–</span> Not started</span></div>';
  h+='<button class="btn'+(cols.length?"":" primary")+'" data-manage="'+ds+'">'+I.list+' Manage '+(ds==="trainer"?"trainer modules":D.items)+'</button></div>';
  if(!cols.length){h+='<div class="empty"><b>No '+(ds==="trainer"?"trainer modules":D.items)+' yet</b>Add them with “Manage '+(ds==="trainer"?"trainer modules":D.items)+'”, or import a file.<div class="acts">'+((ds==="trainer"||ds==="project")&&adm?'<button class="btn primary" data-stdtpl="'+ds+'">'+I.list+' Use standard template</button>':'')+'<button class="btn'+((ds==="trainer"||ds==="project")&&adm?"":" primary")+'" data-manage="'+ds+'">'+I.plus+' Add '+D.items+'</button></div></div>';return h}
  if(!ps.length){h+='<div class="empty"><b>No participants yet</b>'+(ds!=="att"?'The '+plural(cols.length,D.item,D.items)+' below are ready. Add participants and a scoring row appears for each person.':'')+'<div class="acts"><button class="btn primary" data-act="addperson">'+I.plus+' Add participants</button></div></div>'+(ds!=="att"?'<div class="tplprev">'+cols.map((col,i)=>'<div><span class="num">'+(i+1)+'</span>'+esc(col.module)+'<small>'+(ds==="trainer"?"out of "+SKM(c):ds==="project"?"1–3":"%")+'</small></div>').join("")+'</div>':'');return h}
  h+='<div class="tblwrap"><table class="matrix"><thead><tr><th class="namecell">Participant</th><th class="r">'+(ds==="att"?"Present":"Average")+'</th>';
  cols.forEach(col=>{h+='<th class="mc'+(ds==="att"&&adm?" wide":"")+'"><button class="colhd" '+(ds==="att"?'data-reg="'+col.key+'"':'data-coldetail="'+ds+'|'+col.key+'"')+' title="'+esc(col.module)+'">'+esc(short(col.module,32))+'</button>'+(col.date?'<small>'+esc(fmtD(col.date))+'</small>':'')+(col.trainer?'<small>'+esc(short(col.trainer,22))+'</small>':'')+'</th>'});
  h+='</tr></thead><tbody>';
  ps.forEach(p=>{
    const vals=p[D.field]||{};let sum;
    if(ds==="att"){let P=0,H=0;cols.forEach(col=>{const v=vals[col.key];if(v==="P"){P++;H++}else if(v==="A"||v==="R")H++});sum=P+"/"+H}
    else{const a=partAvg(c,ds,p);sum=a==null?"–":pc(a)}
    h+='<tr><td class="namecell"><button class="linkish who" data-person="'+esc(p.id)+'"><b>'+esc(p.name)+'</b><small>'+esc(p.station||"")+'</small></button></td><td class="r num rowsum">'+sum+'</td>';
    cols.forEach(col=>{const v=vals[col.key];
      if(ds==="att"){const cls=v||"E";h+='<td class="c">'+(adm?stSelect(p.id,col.key,v):'<span class="st '+cls+'" data-tip="'+esc(col.module+": "+(ST_LABEL[v]||"No record"))+'">'+ST_SHORT[cls]+'</span>')+'</td>'}
      else if(adm){const shown=v==null?"":(ds==="quiz"?Math.round(v*1000)/10:v);h+='<td class="c"><input class="cellin num" type="number" inputmode="decimal" step="any" min="0" max="'+(ds==="quiz"?100:ds==="trainer"?SKM(c):3)+'" value="'+shown+'" data-cell="'+ds+'|'+esc(p.id)+'|'+col.key+'" aria-label="'+esc(p.name+", "+col.module)+'"></td>'}
      else{const nv=v==null||(ds!=="quiz"&&v===0)?null:norm(ds,v);h+='<td class="c"><span class="sc num" style="'+cellColor(nv)+'">'+(v==null?'<span class="hint">–</span>':(ds==="quiz"?Math.round(v*100):v))+'</span></td>'}
    });
    h+='</tr>'});
  h+='</tbody></table></div>';
  return h;
}

  return h;

function bindSettings(c){
  const f=$("#setForm");if(!f)return;
  f.addEventListener("submit",e=>{e.preventDefault();
    const w={att:+$("#sf-wa").value,quiz:+$("#sf-wq").value,skill:+$("#sf-ws").value,project:+$("#sf-wp").value},sum=w.att+w.quiz+w.skill+w.project;
    if(Math.abs(sum-100)>.01){$("#sferr").textContent="Weights must add up to 100% (currently "+sum+"%).";return}
    upd(c.id,x=>{x.name=$("#sf-name").value.trim()||c.id;x.title=$("#sf-title").value.trim();x.programme=$("#sf-prog").value;x.period=$("#sf-period").value.trim();x.passMark=+$("#sf-pass").value;x.weights=w},"SME details updated");
    toast("Details saved")});
  let armed=false;$("#sfDel").addEventListener("click",async function(){
    if(!armed){armed=true;this.innerHTML="Click again to delete "+esc(c.id);$("#delerr").textContent="This cannot be undone.";return}
    try{await S.db.doc("cohorts/"+c.id).delete();delete S.cohorts[c.id];go(null);toast(c.id+" deleted")}catch(err){toast("Could not delete the SME")}});
}
function logTab(c){
  const l=c.log||[];
  return '<section class="panel"><div class="ph"><div class="t"><h3>Activity log</h3><p>The latest 60 changes made by admins</p></div></div><div class="log">'+(l.length?l.map(e=>'<div><time>'+esc(new Date(e.t).toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}))+'</time><span><b>'+esc(e.by)+'</b> · '+esc(e.msg)+'</span></div>').join(""):'<span class="hint">No changes recorded yet.</span>')+'</div></section>';
}

function closeModal(){$("#modalRoot").innerHTML=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
const mhead=(t,sub)=>'<div class="mh"><div><h2>'+esc(t)+'</h2>'+(sub?'<p>'+esc(sub)+'</p>':'')+'</div><button class="btn sm icon ghost" data-close aria-label="Close">'+I.x+'</button></div>';

function personModal(cid,pid){
  const c=S.cohorts[cid],p=(c.participants||[]).find(x=>x.id===pid);if(!p)return;
  const r=scoreP(c,p),w=weights(c),adm=!!S.admin;
  const comps=[["att","Attendance",w.att,"--s1"],["quiz","Quiz",w.quiz,"--s2"],["skill","Skill",w.skill,"--s3"],["project","Project",w.project,"--s4"]];
  let h=mhead(p.name,[p.staffId||"No staff number",p.station||"No station",p.position].filter(Boolean).join(" · "))+'<div class="mb">';
  h+='<div class="big"><b class="num">'+r.total.toFixed(1)+'%</b>'+pill(status(c,r))+'<span class="hint">Pass mark '+passMark(c)+'%</span></div>';
  h+='<div class="breakdown">'+comps.map(x=>{const v=r.comp[x[0]];return '<div class="bd"><span>'+x[1]+' ('+x[2]+'%)</span><b class="num">'+f1(v)+'</b><div class="t"><i style="width:'+(v==null?0:v/x[2]*100)+'%;background:var('+x[3]+')"></i></div></div>'}).join("")+'</div>';
  h+='<div><div class="sublabel">Attendance · present at '+r.counts.P+' of '+r.held+' sessions held'+(r.counts.N?' ('+r.counts.N+' not started)':'')+'</div><div class="strip">'+
    (c.sessions||[]).map(se=>{const v=(p.att||{})[se.key],cls=v||"E";return '<span class="st '+cls+'" data-tip="'+esc(se.module+"\n"+fmtD(se.date)+"\n"+(ST_LABEL[v]||"No record"))+'">'+ST_SHORT[cls]+'</span>'}).join("")+'</div></div>';
  ["quiz","trainer","project"].forEach(ds=>{const D=DS[ds],cols=c[D.list]||[];const any=cols.some(col=>(p[D.field]||{})[col.key]!=null);if(!cols.length||(!any&&ds!=="quiz"))return;
    h+='<div><div class="sublabel">'+(ds==="trainer"?"Trainer modules":D.label)+'</div>'+hbars(cols.map(col=>{const v=(p[D.field]||{})[col.key];const nv=v==null?null:norm(ds,v);return{label:col.module,value:nv,max:1,text:v==null?"–":ds==="quiz"?pc(v):v+(ds==="trainer"?"/"+SKM(c):"/3")}}),{max:1,color:D.color})+'</div>'});
  if(adm){
    h+='<form id="pform" class="panel" style="margin:0;background:var(--surface-2)"><h3 style="margin-bottom:10px">Edit participant</h3><div class="frow">'+
      '<div class="field"><label for="pf-name">Name</label><input id="pf-name" type="text" value="'+esc(p.name)+'" required></div>'+
      '<div class="field"><label for="pf-staff">Staff number</label><input id="pf-staff" type="text" value="'+esc(p.staffId)+'"></div>'+
      '<div class="field"><label for="pf-station">Station</label><input id="pf-station" type="text" value="'+esc(p.station)+'"></div>'+
      '<div class="field"><label for="pf-pos">Position</label><input id="pf-pos" type="text" value="'+esc(p.position||"")+'"></div>'+
      '<div class="field"><label for="pf-rem">Remark</label><input id="pf-rem" type="text" value="'+esc(p.remark||"")+'"></div></div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn primary" type="submit">Save changes</button><span style="flex:1"></span><button class="btn danger" type="button" id="pdel">'+I.trash+' Remove participant</button></div><div class="err" id="pdelmsg"></div></form>';
  }
  openModal(h+'</div>');
  if(adm){
    $("#pform").addEventListener("submit",e=>{e.preventDefault();
      upd(cid,cc=>{const q=cc.participants.find(x=>x.id===pid);q.name=$("#pf-name").value.trim()||q.name;q.staffId=$("#pf-staff").value.trim();q.station=$("#pf-station").value.trim();q.position=$("#pf-pos").value.trim();q.remark=$("#pf-rem").value.trim()},"Edited participant "+p.name);
      closeModal();toast("Participant saved")});
    let armed=false;$("#pdel").addEventListener("click",()=>{
      if(!armed){armed=true;$("#pdel").textContent="Click again to confirm";$("#pdelmsg").textContent="All attendance and scores for this participant will be removed.";return}
      removePerson(cid,pid);closeModal()});
  }
}
function removePerson(cid,pid){const p=S.cohorts[cid].participants.find(x=>x.id===pid);upd(cid,c=>{c.participants=c.participants.filter(x=>x.id!==pid)},"Removed participant "+(p?p.name:pid));toast("Participant removed")}
function confirmRemove(pid){
  const p=S.cohorts[S.current].participants.find(x=>x.id===pid);if(!p)return;
  openModal(mhead("Remove participant?",S.current)+'<div class="mb"><p>Remove <b>'+esc(p.name)+'</b> and all of their attendance and scores from '+esc(S.current)+'? This cannot be undone.</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn danger" id="cfDel">'+I.trash+' Remove</button></div></div>',true);
  $("#cfDel").addEventListener("click",()=>{removePerson(S.current,pid);closeModal()});
}
function loginModal_orig(msg){
  if(typeof msg!=="string"){msg="";S.afterLogin=null}
  openModal(mhead("Sign in",msg||"Sign in with the account your Genco Academy admin gave you.")+
  '<form class="mb" id="lform"><div class="field"><label for="lu">Username</label><input id="lu" type="text" autocomplete="username" required></div>'+
  '<div class="field"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required></div><div class="err" id="lerr"></div>'+
  '<button class="btn primary" type="submit">Sign in</button></form>',true);
  $("#lform").addEventListener("submit",async e=>{e.preventDefault();
    if(S.db&&!S.authLoaded){try{const d=await S.db.doc("config/admin").get();S.auth=d.exists?d.data():null;S.authLoaded=true}catch(_){}}
    const u=await doLogin($("#lu").value.trim(),$("#lp").value);
    if(u){applyMe(u);closeModal();
      if(S.db&&S.users&&Array.isArray(S.users.users)){const d=clone(S.users),x=d.users.find(z=>z.username===u.username);if(x){x.lastLogin=new Date().toISOString();S.db.doc("config/users").set(d).catch(()=>{})}}
      if(u.mustChange){S.setTab="personal";S.current="__settings";S.afterLogin=null}else if(!S.current)goHomePref();
      render();toast("Signed in as "+(u.displayName||u.username));const fn=S.afterLogin;S.afterLogin=null;if(fn&&(S.admin||!/newCohort|addPerson|manage/i.test(String(fn))))setTimeout(fn,80)}
    else $("#lerr").textContent="Username or password is incorrect.";});
}
function cohortId(s){const id=String(s||"").trim().toUpperCase().replace(/\s+/g,"-").replace(/[^A-Z0-9_\-]/g,"");return id||null}
function blankCohort(id,name){return{id,name:name||id,title:"SME Foundation Programme",period:"",passMark:65,weights:{att:20,quiz:20,skill:10,project:50},sessions:[],quizModules:[],trainerTopics:[],projectCriteria:[],participants:[],log:[]}}
function nextSme(){let mx=0;ids().forEach(id=>{const m=id.match(/(\d+)$/);if(m)mx=Math.max(mx,+m[1])});return mx?"SME"+(mx+1):"SME1"}
function newCohortModal(){
  if(!S.admin){loginModal();return}
  const list=ids();
  openModal(mhead("Add SME","Create the SME, then add participants, modules and results.")+'<form class="mb" id="ncf"><div class="frow">'+
    '<div class="field"><label for="nc-id">SME code</label><input id="nc-id" type="text" value="'+nextSme()+'" required></div>'+
    '<div class="field"><label for="nc-period">Period</label><input id="nc-period" type="text" placeholder="e.g. Jan – Dec 2027"></div></div>'+
    '<div class="field"><label for="nc-prog">SME group</label><select id="nc-prog">'+PROGS.map(p=>'<option value="'+p[0]+'"'+((S.prog||"GENCO")===p[0]?" selected":"")+'>'+p[1]+'</option>').join("")+'</select></div>'+'<div class="field"><label for="nc-title">Programme</label><input id="nc-title" type="text" value="SME Foundation Programme"></div>'+
    '<div class="field"><label for="nc-from">Start from</label><select id="nc-from"><option value="">Blank SME</option>'+list.map(id=>'<option value="'+esc(id)+'">Copy sessions, quizzes, trainer modules and criteria from '+esc(id)+'</option>').join("")+'</select><span class="hint">Copying brings over the structure only. Participants, dates and scores start empty. Trainer assessment (10 competencies, out of 5) and Project assessment (12 criteria, 1–3) are always set up for you.</span></div>'+
    '<div class="err" id="ncerr"></div><button class="btn primary" type="submit">'+I.plus+' Create SME</button></form>',true);
  $("#ncf").addEventListener("submit",e=>{e.preventDefault();
    const id=cohortId($("#nc-id").value);if(!id){$("#ncerr").textContent="Use letters, numbers or hyphens.";return}
    if(S.cohorts[id]){$("#ncerr").textContent=id+" already exists.";return}
    if(!S.db){$("#ncerr").textContent="The database is not available in this view.";return}
    const c=blankCohort(id,$("#nc-id").value.trim().toUpperCase());c.title=$("#nc-title").value.trim();c.programme=$("#nc-prog").value;c.period=$("#nc-period").value.trim();
    const src=S.cohorts[$("#nc-from").value];
    if(src){Object.keys(DS).forEach(k=>{const L=src[DS[k].list]||[];if(L.length)c[DS[k].list]=L.map(x=>({key:x.key,module:x.module,date:""}))});if((src.trainerTopics||[]).length&&src.skillMax)c.skillMax=src.skillMax}
    Object.assign(c,stdTpl(c));
    queueSave(c,"Created SME "+id+(src?" (structure copied from "+src.id+")":""));closeModal();go(id);toast(id+" created")});
}
function addPersonModal(){
  openModal(mhead("Add participants",S.current)+'<div class="mb">'+staffLookupH()+'<form id="apf" class="panel" style="margin:0" novalidate><div class="aphead"><h3>Participants to add <span class="num hint" id="apCount"></span></h3><span class="hint">Pick several people from the directory above, or type them in. Each one gets its own row.</span></div>'+
    '<div class="apgrid aplabels" aria-hidden="true"><span>Name</span><span>Staff number</span><span>Station</span><span>Position</span><span></span></div><div id="apRows"></div>'+
    '<div class="err" id="aperr"></div><div class="apacts"><button class="btn" type="button" id="apMore">'+I.plus+' Another row</button><button class="btn primary" type="submit" id="apGo">'+I.plus+' Add participant</button></div></form>'+
    '<form id="bpf" class="panel" style="margin:0"><h3>Paste a list</h3><p class="hint" style="margin:4px 0 10px">Paste one participant per line: Name, Staff number, Station — or just staff numbers, one per line, to fill the rest from the staff directory. Columns copied from Excel (tab separated) also work.</p><textarea id="bp" rows="5" placeholder="Ahmad bin Ali, 10012345, SJ Kapar&#10;10091016&#10;96000207"></textarea><div class="err" id="bperr"></div><button class="btn" type="submit">'+I.plus+' Add all</button></form></div>');
  const add=list=>{let n=0;upd(S.current,c=>{list.forEach(x=>{if(!x.name)return;if(c.participants.some(p=>(x.staffId&&p.staffId===x.staffId)||p.name.toLowerCase()===x.name.toLowerCase()))return;let id=GA.keyOf(x.name,x.staffId);while(c.participants.some(p=>p.id===id))id+="x";c.participants.push({id,no:c.participants.length+1,name:x.name,staffId:x.staffId||"",station:x.station||"",position:x.position||"",remark:"",att:{},quiz:{},trainer:{},project:{}});n++})},"Added "+plural(list.length,"participant","participants"));return n};
  const box=$("#apRows"),cur=S.cohorts[S.current],F=[["n","name","Name"],["s","staffId","Staff number"],["st","station","Station"],["pos","position","Position"]];let rid=0;
  const rowH=(v)=>{rid++;return '<div class="apgrid aprow" data-r="'+rid+'">'+F.map(f=>'<input type="text" data-f="'+f[1]+'" aria-label="'+f[2]+'" placeholder="'+f[2]+'" value="'+esc(v&&v[f[1]]||"")+'">').join("")+'<button type="button" class="btn sm icon ghost" data-aprm aria-label="Remove row">'+I.x+'</button></div>'};
  const read=()=>[...box.querySelectorAll(".aprow")].map(r=>{const o={};r.querySelectorAll("input").forEach(i=>o[i.dataset.f]=i.value.trim());return o});
  const sync=()=>{const L=read().filter(x=>x.name),n=L.length;$("#apGo").innerHTML=I.plus+(n>1?" Add "+n+" participants":" Add participant");$("#apCount").textContent=n?"· "+n:"";
    box.querySelectorAll(".aprow").forEach(r=>{const nm=r.querySelector('[data-f="name"]').value.trim(),sid=r.querySelector('[data-f="staffId"]').value.trim();r.classList.toggle("dup",!!(cur&&nm&&(cur.participants||[]).some(p=>(sid&&p.staffId===sid)||p.name.toLowerCase()===nm.toLowerCase())))})};
  const addRow=v=>{box.insertAdjacentHTML("beforeend",rowH(v));sync();return box.lastElementChild};
  addRow();
  box.addEventListener("input",sync);
  box.addEventListener("click",e=>{const b=e.target.closest("[data-aprm]");if(!b)return;b.closest(".aprow").remove();if(!box.children.length)addRow();sync()});
  $("#apMore").addEventListener("click",()=>{addRow().querySelector("input").focus()});
  bindStaffLookup(p=>{const L=read();if(L.some(x=>x.staffId&&x.staffId===p.staffId)){toast(p.name+" is already in the list");return}
    const v={name:p.name,staffId:p.staffId,station:staffStation(p),position:p.position||""};
    const empty=[...box.querySelectorAll(".aprow")].find(r=>![...r.querySelectorAll("input")].some(i=>i.value.trim()));
    if(empty){empty.querySelectorAll("input").forEach(i=>i.value=v[i.dataset.f]||"");sync()}else addRow(v);
    const q=$("#sdq");if(q)q.focus()});
  $("#apf").addEventListener("submit",e=>{e.preventDefault();const L=read().filter(x=>x.name||x.staffId);
    if(!L.length){$("#aperr").textContent="Add at least one participant.";return}
    if(L.some(x=>!x.name)){$("#aperr").textContent="Every row needs a name.";return}
    const n=add(L),skip=L.length-n;closeModal();toast(n?plural(n,"participant","participants")+" added"+(skip?" · "+skip+" already in this SME":""):"They are already in this SME")});
  $("#bpf").addEventListener("submit",e=>{e.preventDefault();
    const rows=$("#bp").value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split(l.includes("\t")?"\t":",").map(x=>x.trim());if(/^\d{6,}$/.test(p[0])&&S.staff){const st=staffById(p[0]);if(st)return{name:st.name,staffId:st.staffId,station:staffStation(st),position:st.position}}const st=p[1]&&S.staff?staffById(p[1]):null;return{name:p[0],staffId:p[1]||"",station:p.slice(2).join(", ")||(st?staffStation(st):""),position:st?st.position:""}}).filter(x=>x.name&&!/^name$/i.test(x.name)&&!/^\d+$/.test(x.name));
    if(!rows.length){$("#bperr").textContent="Paste at least one line.";return}
    const n=add(rows);closeModal();toast(plural(n,"participant","participants")+" added")});
}
function manageModal(ds,focusAdd){
  const c=S.cohorts[S.current],D=DS[ds],cols=c[D.list]||[],dated=!!D.dated,isT=ds==="trainer",two=dated||isT,sc=$(".modal")?$(".modal").scrollTop:0;
  let h=mhead("Manage "+(isT?"trainer modules":D.items),D.label+" · "+(c.name||c.id))+'<div class="mb"><p class="hint">'+(isT?'Add each trainer module with the trainer who delivers it. ':'')+'Rename or re-date in place (saved when you leave the field). Use the arrows to reorder. Removing a '+D.item+' also removes its recorded '+(ds==="att"?"attendance":"scores")+' for every participant.</p><div class="mlist">';
  if(!cols.length)h+='<div class="hint">No '+D.items+' yet. Add the first one below.</div>';
  cols.forEach((col,i)=>{
    h+='<div class="mitem'+(two?"":" nodate")+'"><span class="ix num">'+(i+1)+'</span><input type="text" value="'+esc(col.module)+'" data-mname="'+ds+'|'+col.key+'" aria-label="'+D.Item+' '+(i+1)+' name">'+
      (isT?'<input class="dt" type="text" placeholder="Trainer name" value="'+esc(col.trainer||"")+'" data-mtrainer="'+ds+'|'+col.key+'" aria-label="Module '+(i+1)+' trainer">':'')+(dated?'<input class="dt" type="'+(!col.date||/^\d{4}-\d{2}-\d{2}$/.test(col.date)?"date":"text")+'" value="'+esc(col.date||"")+'" data-mdate="'+ds+'|'+col.key+'" aria-label="'+D.Item+' '+(i+1)+' date">':'')+
      '<span class="ops"><button class="btn sm icon ghost" data-mmove="'+ds+'|'+col.key+'|-1"'+(i===0?" disabled":"")+' aria-label="Move up">'+I.upA+'</button><button class="btn sm icon ghost" data-mmove="'+ds+'|'+col.key+'|1"'+(i===cols.length-1?" disabled":"")+' aria-label="Move down">'+I.dnA+'</button><button class="btn sm icon ghost danger" data-mdel="'+ds+'|'+col.key+'" aria-label="Remove">'+I.trash+'</button></span></div>'});
  h+='</div><form class="addrow'+(two?"":" nodate")+'" id="maddf"><input id="madd-n" type="text" placeholder="New '+D.item+' name" aria-label="New '+D.item+' name" required>'+(dated?'<input id="madd-d" type="date" aria-label="Date">':'')+(isT?'<input id="madd-t" type="text" placeholder="Trainer name" aria-label="Trainer name">':'')+'<button class="btn primary" type="submit">'+I.plus+' Add '+D.item+'</button></form></div>';
  openModal(h);
  const m=$(".modal");m.scrollTop=sc;
  if(focusAdd)setTimeout(()=>{const x=$("#madd-n");if(x)x.focus({preventScroll:true})},40);
  $("#maddf").addEventListener("submit",e=>{e.preventDefault();const name=$("#madd-n").value.trim();if(!name)return;const date=dated?$("#madd-d").value:"",trainer=isT?$("#madd-t").value.trim():"";
    upd(S.current,cc=>{cc[D.list]=cc[D.list]||[];let n=1;while(cc[D.list].some(x=>x.key===D.prefix+n))n++;cc[D.list].push(isT?{key:D.prefix+n,module:name,date:"",trainer}:{key:D.prefix+n,module:name,date})},"Added "+D.item+" “"+name+"”");
    manageModal(ds,true);$(".modal").scrollTop=1e6});
}

function colDetailModal(ds,key){
  const c=S.cohorts[S.current],D=DS[ds],col=(c[D.list]||[]).find(x=>x.key===key);if(!col)return;
  const rows=(c.participants||[]).map(p=>({p,v:(p[D.field]||{})[key]})).filter(x=>typeof x.v==="number"&&(ds==="quiz"||x.v>0)).sort((a,b)=>b.v-a.v);
  const a=avg(rows.map(x=>x.v)),miss=(c.participants||[]).length-rows.length;
  const fmt=v=>ds==="quiz"?pc(v):v+(ds==="trainer"?" / "+SKM(c):" / 3");
  let h=mhead(col.module,[ds==="trainer"?"Trainer module":D.label,col.date?fmtD(col.date):"",col.trainer?"Trainer: "+col.trainer:""].filter(Boolean).join(" · "))+'<div class="mb">';
  h+='<div class="breakdown"><div class="bd"><span>Average</span><b class="num">'+(a==null?"–":fmt(Math.round(a*100)/100))+'</b></div><div class="bd"><span>Scored</span><b class="num">'+rows.length+'</b></div><div class="bd"><span>Highest</span><b class="num">'+(rows.length?fmt(rows[0].v):"–")+'</b></div><div class="bd"><span>No score</span><b class="num">'+miss+'</b></div></div>';
  h+=rows.length?hbars(rows.map(x=>{const nv=norm(ds,x.v);return{label:x.p.name,sub:x.p.station,value:nv,max:1,text:ds==="quiz"?pc(x.v):String(x.v),color:rateColor(nv),act:'data-person="'+esc(x.p.id)+'"'}}),{max:1}):emptyChart("No scores entered for this "+D.item+" yet.");
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-tab="'+ds+'">Open '+(ds==="trainer"?"trainer modules":D.label.toLowerCase())+' '+I.arrow+'</button><button class="btn" data-manage="'+ds+'">'+I.list+' Manage '+(ds==="trainer"?"trainer modules":D.items)+'</button></div></div>';
  openModal(h);
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act],[data-go],[data-home],[data-tab],[data-person],[data-sort],[data-manage],[data-mmove],[data-mdel],[data-delp],[data-reg],[data-station],[data-coldetail],[data-markall],#clrSt");if(!t||t.disabled)return;
  const d=t.dataset;
  if(d.home!==undefined){go(null);return}
  if(d.go){closeModal();go(d.go);return}
  if(d.tab){closeModal();setTab(d.tab);return}
  if(t.id==="clrSt"){S.station="";render();return}
  if(d.reg){closeModal();S.regSession=d.reg;if(S.tab!=="att")setTab("att");else render();setTimeout(()=>{const r=$("#register");if(r)r.scrollIntoView({behavior:"smooth",block:"start"})},60);return}
  if(d.station!==undefined){S.station=d.station;S.q="";setTab("people");return}
  if(d.coldetail){colDetailModal(...d.coldetail.split("|"));return}
  if(d.markall!==undefined){const v=d.markall,key=S.regSession||($("#regSel")||{}).value;if(!key)return;
    upd(S.current,c=>{c.participants.forEach(p=>{p.att=p.att||{};if(v)p.att[key]=v;else delete p.att[key]})},"Register: "+(v?"marked all "+ST_LABEL[v].toLowerCase():"cleared")+" for one session");return}
  if(d.person){personModal(S.current,d.person);return}
  if(d.delp){confirmRemove(d.delp);return}
  if(d.sort){const k=d.sort;S.sort=S.sort.k===k?{k,d:-S.sort.d}:{k,d:(k==="name"||k==="station")?1:-1};render();return}
  if(d.manage){const m=d.manage;needAdmin(()=>manageModal(m));return}
  if(d.cyc){const [pid,key]=d.cyc.split("|"),order=["P","A","R","N",null];
    upd(S.current,c=>{const p=c.participants.find(x=>x.id===pid);p.att=p.att||{};const cur=p.att[key]||null,nx=order[(order.indexOf(cur)+1)%order.length];if(nx)p.att[key]=nx;else delete p.att[key]},"Attendance updated");return}
  if(d.mmove){const [ds,key,dir]=d.mmove.split("|"),D=DS[ds];
    upd(S.current,c=>{const a=c[D.list],i=a.findIndex(x=>x.key===key),j=i+(+dir);if(i<0||j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]},"Reordered "+D.items);manageModal(ds);return}
  if(d.mdel){const [ds,key]=d.mdel.split("|"),D=DS[ds];
    if(d.armed!=="1"){t.dataset.armed="1";t.classList.remove("icon");t.innerHTML="Confirm";return}

const loaded={};
function loadLib(name){
  if(loaded[name])return loaded[name];
  loaded[name]=new Promise((res,rej)=>{const urls=LIBS[name].slice();
    (function next(){const u=urls.shift();if(!u){delete loaded[name];rej(new Error("Could not load the "+name+" library."));return}
      const s=document.createElement("script");s.src=u;s.onload=()=>res();s.onerror=()=>{s.remove();next()};document.head.appendChild(s)})()});
  return loaded[name];
}

function upState(html){const e=$("#upState");if(e)e.innerHTML=html}
async function handleFile(f){
  const ext=(f.name.split(".").pop()||"").toLowerCase();
  upState('<div class="hint"><span class="spin"></span> Reading '+esc(f.name)+'…</div>');
  try{
    await loadLib("xlsx");
    const buf=await f.arrayBuffer();let parsed,text="";
    if(["xlsx","xls","xlsm","csv"].includes(ext)){parsed=GA.parseWorkbook(XLSX,XLSX.read(buf,{type:"array",cellDates:true}))}
    else if(ext==="docx"){
      await loadLib("mammoth");
      const res=await mammoth.convertToHtml({arrayBuffer:buf}),doc=new DOMParser().parseFromString(res.value,"text/html");
      text=doc.body.textContent||"";
      parsed=GA.parseWorkbook(XLSX,tablesToBook(Array.from(doc.querySelectorAll("table")).map(t=>XLSX.utils.sheet_to_json(XLSX.utils.table_to_sheet(t),{header:1,raw:true,defval:null}))));
    }else if(ext==="pdf"){
      await loadLib("pdfw");await loadLib("pdf");
      const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc=LIBS.pdfw[0];
      const pdf=await lib.getDocument({data:new Uint8Array(buf)}).promise;let all=[];
      for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i),tc=await pg.getTextContent(),rr=pdfRows(tc.items);all=all.concat(rr);text+=rr.map(r=>r.join("\t")).join("\n")+"\n"}
      parsed=GA.parseWorkbook(XLSX,tablesToBook(splitBlocks(all)));
    }else throw new Error("This file type is not supported. Use .xlsx, .csv, .docx or .pdf.");
    parsed.participants=parsed.participants.filter(p=>Object.keys(p.att).length+Object.keys(p.quiz).length+Object.keys(p.trainer).length+Object.keys(p.project).length>0||parsed.found.length<=1);
    S.upload={file:f.name,ext,parsed,text};showPreview();
  }catch(err){upState('<div class="notice">'+esc(err.message||"The file could not be read.")+'</div>')}
}
function numify(v){if(typeof v!=="string")return v;const s=v.trim();const m=s.match(/^(-?\d+(?:[.,]\d+)?)\s*%$/);if(m)return parseFloat(m[1].replace(",","."))/100;if(/^-?\d+(?:\.\d+)?$/.test(s))return parseFloat(s);return v}
function classify(rows){
  const flat=rows.map(r=>(r||[]).map(x=>x==null?"":String(x)).join(" ")).join(" ").toLowerCase();
  if(/\battend|absent|hadir/.test(flat))return "Attendance";
  if(/\d[a-z]\s*\.\s*(plant|technical|quality|problem|business|planning|financial)/.test(flat))return "Project";
  if(/trainer|skill assessment/.test(flat))return "Trainer Assessment";
  if(/quiz|kuiz|score|markah/.test(flat))return "Quiz";
  let nums=0,cells=0;rows.slice(1).forEach(r=>(r||[]).forEach(x=>{if(x!=null&&x!==""){cells++;if(typeof numify(x)==="number")nums++}}));
  return cells&&nums/cells>.35?"Quiz":"Name list";
}
function tablesToBook(tables){
  const wb=XLSX.utils.book_new(),used={};
  tables.forEach(rows=>{rows=rows.map(r=>(r||[]).map(numify));if(rows.length<2)return;
    const isName=x=>/^(name|nama)$/i.test(String(x||"").trim());
    if(!rows.slice(0,12).some(r=>r.some(isName)))return;
    rows=rows.map(r=>r.map(x=>isName(x)?"Name":x));
    const nm=classify(rows);if(used[nm])return;used[nm]=1;XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),nm)});
  if(!wb.SheetNames.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["-"]]),"Empty");
  return wb;
}
function pdfRows(items){
  const lines=[];items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=Math.round(it.transform[5]),x=it.transform[4];
    let L=lines.find(l=>Math.abs(l.y-y)<=3);if(!L){L={y,items:[]};lines.push(L)}L.items.push({x,w:it.width||0,s:it.str.trim()})});
  lines.sort((a,b)=>b.y-a.y);
  return lines.map(l=>{l.items.sort((a,b)=>a.x-b.x);const out=[];let prev=null;l.items.forEach(it=>{if(prev&&it.x-(prev.x+prev.w)<4)out[out.length-1]+=" "+it.s;else out.push(it.s);prev=it});return out});
}
function splitBlocks(rows){const blocks=[];let cur=[];rows.forEach(r=>{const f=String(r[0]||"").toLowerCase();if((f==="no"||f==="no."||f==="bil")&&cur.length){blocks.push(cur);cur=[]}cur.push(r)});if(cur.length)blocks.push(cur);return blocks}

async function aiExtract(){

  if(!sample){msg.textContent="Claude is not available in this view. Please use the Excel template.";return}
  btn.disabled=true;msg.innerHTML='<span class="spin"></span> Claude is reading the document (usually 20–60 seconds)…';
  const prompt="You extract training-programme assessment data from a document (Genco Academy SME programme). Return ONLY JSON with this shape:\n"+
   '{"sessions":[{"module":"PPA","date":"2026-05-05"}],"quizModules":[{"module":"PPA"}],"trainerTopics":[{"module":"7th Step"}],"projectCriteria":[{"module":"1A.Plant performance knowledge"}],'+
   '"participants":[{"name":"Full Name","staffId":"10074674","station":"SSJ Kenyir","attendance":["Attend","Absent","Absent with Reason","Not Started",null],"quiz":[0.9,null],"trainer":[15,null],"project":[2,null]}]}\n'+
   "Rules: attendance/quiz/trainer/project arrays align by index with sessions/quizModules/trainerTopics/projectCriteria. Quiz scores as fractions 0-1. Trainer marks out of 20. Project criteria on a 1-3 scale. Use null for missing values. Use empty arrays for sections not present. Dates as YYYY-MM-DD when known, else empty string. Do not invent people or numbers.\n\nDOCUMENT TEXT:\n"+String(u.text).slice(0,180000);
  try{
    const j=await sample.json(prompt,{modelTier:"default"});
    const out={sessions:[],quizModules:[],trainerTopics:[],projectCriteria:[],participants:[],found:["Extracted by Claude"]};
    [["sessions","a","attendance","Sessions"],["quizModules","q","quiz","Quizzes"],["trainerTopics","t","trainer","Trainer topics"],["projectCriteria","p","project","Project criteria"]].forEach(m=>{
      (j[m[0]]||[]).forEach((c,i)=>out[m[0]].push({key:m[1]+(i+1),module:String(c.module||("Item "+(i+1))),date:c.date||""}));
      if(out[m[0]].length)out.found.push(m[3]+": "+out[m[0]].length)});
    (j.participants||[]).forEach((p,i)=>{if(!p||!p.name)return;
      const P={id:GA.keyOf(p.name,p.staffId),no:i+1,name:GA.clean(p.name),staffId:GA.clean(p.staffId),station:GA.clean(p.station),position:"",remark:"",att:{},quiz:{},trainer:{},project:{}};
      (p.attendance||[]).forEach((v,k)=>{const s=GA.normStatus(v);if(s&&out.sessions[k])P.att["a"+(k+1)]=s});
      (p.quiz||[]).forEach((v,k)=>{if(typeof v==="number"&&out.quizModules[k])P.quiz["q"+(k+1)]=v>1?v/100:v});
      (p.trainer||[]).forEach((v,k)=>{if(typeof v==="number"&&v>0&&out.trainerTopics[k])P.trainer["t"+(k+1)]=v});
      (p.project||[]).forEach((v,k)=>{if(typeof v==="number"&&v>0&&out.projectCriteria[k])P.project["p"+(k+1)]=v});
      out.participants.push(P)});
    u.parsed=out;u.text="";showPreview();
  }catch(e){btn.disabled=false;msg.textContent=e&&e.code==="not_granted"?"Permission for Claude was declined.":e&&e.code==="rate_limited"?"Too many requests. Try again in a moment.":"Claude could not extract data from this document."}
}
const normMod=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
function mergeParsed(base,parsed,mode){
  const c=clone(base);c.participants=c.participants||[];
  const dsFound=Object.keys(DS).filter(k=>(parsed[DS[k].list]||[]).length>0);
  if(mode==="replace"){
    dsFound.forEach(k=>{c[DS[k].list]=[];c.participants.forEach(p=>{p[DS[k].field]={}})});
    const keep={};parsed.participants.forEach(p=>{keep[p.id]=1;keep["n"+normMod(p.name)]=1});
    if(parsed.participants.length)c.participants=c.participants.filter(p=>keep[p.id]||keep["n"+normMod(p.name)]);
  }
  const maps={};
  dsFound.forEach(k=>{const D=DS[k],tgt=c[D.list]=c[D.list]||[],used={};maps[k]={};
    parsed[D.list].forEach(col=>{let hit=tgt.find(t=>!used[t.key]&&normMod(t.module)===normMod(col.module)&&(!t.date||!col.date||t.date===col.date));
      if(!hit){let n=1;while(tgt.some(x=>x.key===D.prefix+n))n++;hit={key:D.prefix+n,module:col.module,date:col.date||""};tgt.push(hit)}
      else if(!hit.date&&col.date)hit.date=col.date;
      used[hit.key]=1;maps[k][col.key]=hit.key})});
  let added=0,updated=0;
  parsed.participants.forEach(pp=>{
    let t=c.participants.find(x=>x.id===pp.id)||c.participants.find(x=>normMod(x.name)===normMod(pp.name));
    if(!t){t={id:pp.id,name:pp.name,staffId:pp.staffId,station:pp.station,position:"",remark:"",att:{},quiz:{},trainer:{},project:{}};while(c.participants.some(x=>x.id===t.id))t.id+="x";c.participants.push(t);added++}else updated++;
    if(pp.staffId)t.staffId=pp.staffId;if(pp.station)t.station=pp.station;
    dsFound.forEach(k=>{const D=DS[k];t[D.field]=t[D.field]||{};Object.keys(pp[D.field]||{}).forEach(ck=>{const tk=maps[k][ck];if(tk)t[D.field][tk]=pp[D.field][ck]})})});
  c.participants.forEach((p,i)=>{p.no=i+1});
  if(parsed.skillMax&&dsFound.includes("trainer"))c.skillMax=parsed.skillMax;
  return{c,added,updated};
}

S.hist={};S.histLoaded=false;S.hq="";S.hBatch="";S.hStatus="";S.hGrade="";S.hLimit=60;
function subscribeHistory(){

function smeLabel(id,name){const m=String(name||id).match(/^SME\s*(\d+)(.*)$/i);return m?"SME "+m[1]+m[2]:String(name||id)}
function liveStart(c){let a=Infinity,e=-Infinity;(c.sessions||[]).forEach(s=>{const r=parseRange(s.date);if(r){a=Math.min(a,r[0]);e=Math.max(e,r[1])}});return a<Infinity?{a,e}:null}
const isoD=t=>new Date(t).toISOString().slice(0,10);
function liveRec(c,p,ls){return{name:p.name,staffId:p.staffId,station:p.station,status:/withdraw/i.test(p.remark||"")?"Withdrawn / transferred":"In progress",unit:p.position||"",start:ls?isoD(ls.a):"",end:ls?isoD(ls.e):"",completed:true,_live:true,_cid:c.id,_pid:p.id}}

function hBatches(){const r=hBatchesRaw().filter(b=>!S.prog||progOf(b)===S.prog);return S.me&&S.me.role==="viewer"?r.filter(b=>canSme(b.id)):r}
function hBatchesRaw(){
  const key=[S.hist,S.cohorts];if(HBC.key&&HBC.key[0]===S.hist&&HBC.key[1]===S.cohorts&&HBC.n===Object.keys(S.cohorts).length+":"+Object.values(S.cohorts).map(c=>(c.participants||[]).length+(c.updatedAt||"")).join())return HBC.val;
  const out=Object.values(S.hist).map(b=>({...b}));
  Object.keys(S.cohorts).forEach(id=>{const c=S.cohorts[id],ls=liveStart(c),ps=c.participants||[];
    let b=out.find(x=>x.id===id);
    if(b){const have=new Set((b.records||[]).map(r=>(r.staffId||"")+"|"+String(r.name).toLowerCase().replace(/[^a-z]/g,"")));
      const sid=new Set((b.records||[]).map(r=>r.staffId).filter(Boolean)),nm=new Set((b.records||[]).map(r=>String(r.name).toLowerCase().replace(/[^a-z]/g,"")));
      const extra=ps.filter(p=>!(p.staffId&&sid.has(p.staffId))&&!nm.has(String(p.name).toLowerCase().replace(/[^a-z]/g,""))).map(p=>liveRec(c,p,ls));
      if(extra.length)b.records=(b.records||[]).concat(extra);b.cohort=true;if(!b.programme)b.programme=progOf(c)}
    else out.push({id,label:smeLabel(id,c.name),programme:progOf(c),start:ls?isoD(ls.a):"",end:ls?isoD(ls.e):"",virtual:true,cohort:true,records:ps.map(p=>liveRec(c,p,ls))});

/* import master data (tabs "Final data" + "Not Completed") */
const H_MON={jan:1,feb:2,mac:3,mar:3,apr:4,mei:5,may:5,jun:6,jul:7,ogo:8,aug:8,sep:9,okt:10,oct:10,nov:11,dis:12,dec:12};
function hDate(v){
  if(v==null||v==="")return "";
  if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+12*36e5);return d.toISOString().slice(0,10)}
  const s=String(v).trim();let m=s.match(/^(\d{1,2})\s+([A-Za-z]+)\s+(\d{2,4})$/);
  if(m&&H_MON[m[2].toLowerCase().slice(0,3)]){let y=+m[3];if(y<100)y+=2000;return y+"-"+String(H_MON[m[2].toLowerCase().slice(0,3)]).padStart(2,"0")+"-"+m[1].padStart(2,"0")}
  m=s.match(/^([A-Za-z]+)-(\d{2})$/);if(m&&H_MON[m[1].toLowerCase().slice(0,3)])return (2000+ +m[2])+"-"+String(H_MON[m[1].toLowerCase().slice(0,3)]).padStart(2,"0");
  return s;
}
function hStat(s){const t=String(s||"").toLowerCase();if(!t)return "Pending";if(t==="graduated")return "Graduated";if(t.includes("defer"))return "Deferred";if(/withdraw|ithdraw|transfer/.test(t))return "Withdrawn / transferred";if(t.includes("not"))return "Not completed";return "Graduated"}
const H_GMAP={green:"Green",black:"Black","blackbelt mastery":"Blackbelt Mastery",architech:"Architect",architect:"Architect","blackbelt (gld)":"Blackbelt (GLD)"};
function parseHistoryBook(wb){
  const batches={};let found=[];
  wb.SheetNames.forEach(name=>{
    const low=name.toLowerCase();const completed=/final/.test(low)?true:/not\s*complet/.test(low)?false:null;if(completed===null)return;
    const R=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
    let hr=-1,col={};for(let i=0;i<Math.min(8,R.length);i++){const row=(R[i]||[]).map(x=>GA.clean(x).toLowerCase());if(row.includes("name")){hr=i;row.forEach((h,j)=>{if(h&&col[h]==null)col[h]=j});break}}
    if(hr<0)return;
    const g=(row,k)=>col[k]!=null?row[col[k]]:null;let n=0;
    R.slice(hr+1).forEach(row=>{row=row||[];const nm=GA.clean(g(row,"name"));if(!nm)return;
      let sme=GA.clean(g(row,"sme"))||"0",id,label;const m=sme.match(/^(\d+)\s*\((\w+)\)$/);
      if(m){id="SME"+m[1]+"-"+m[2].toUpperCase();label="SME "+m[1]+" ("+m[2].toUpperCase()+")"}else if(/^\d+$/.test(sme)){id="SME"+sme;label="SME "+sme}else{id=sme.toUpperCase().replace(/[^A-Z0-9_\-]/g,"")||"OTHER";label=sme.toUpperCase()}
      const b=batches[id]=batches[id]||{id,label,dates:{},records:[]};
      let sid=GA.clean(g(row,"staff number")),note="";if(sid&&!/^[A-Za-z]?\d+$/.test(sid)){note=sid;sid=""}
      const st=GA.clean(g(row,"status")),sd=hDate(g(row,"start date")),ed=hDate(g(row,"end date")),gr=GA.clean(g(row,"grade"));
      const dk=sd+"|"+ed;b.dates[dk]=(b.dates[dk]||0)+1;
      let status=hStat(st);if(!completed&&status==="Graduated")status="Not completed";if(!completed&&!st)status="Not completed";
      const un=GA.clean(g(row,"current unit"));
      const rec={name:nm,staffId:sid,station:GA.clean(g(row,"station")),status,statusRaw:st.replace(/^ithdraw/,"Withdraw"),grade:/^(o|0)$/i.test(gr)?"":(H_GMAP[gr.toLowerCase()]||gr),start:sd,end:ed,unit:/^(χ|x|-|#n\/a)$/i.test(un)?"":un,staffStatus:GA.clean(g(row,"staff status")),completed};
      if(note)rec.note=note;Object.keys(rec).forEach(k=>{if(rec[k]==="")delete rec[k]});b.records.push(rec);n++});
    found.push(name+": "+n+" records");
  });
  const docs=Object.values(batches).map(b=>{const top=Object.entries(b.dates).sort((x,y)=>y[1]-x[1])[0];const [s,e]=(top?top[0]:"|").split("|");return{id:b.id,label:b.label,start:s,end:e,source:"",records:b.records}});
  docs.sort((a,b)=>(a.start||"9999").localeCompare(b.start||"9999")||a.id.localeCompare(b.id));docs.forEach((d,i)=>d.order=i);
  return{docs,found};
}

function avgN(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}
function yGantt(L){
  const rows=L.map((x,i)=>{let a=hParse(x.start),e=hParse(x.end);if(a==null&&e==null)return null;if(a==null)a=e;if(e==null)e=a;if(/^\d{4}-\d{2}$/.test(x.end||""))e+=27*864e5;if(e<a){const t=a;a=e;e=t}return{x,a,e,i}}).filter(Boolean);
  if(!rows.length)return emptyChart("No dates recorded for these intakes.");
  let mn=Math.min(...rows.map(r=>r.a)),mx=Math.max(...rows.map(r=>r.e));const y0=new Date(mn).getUTCFullYear(),y1=new Date(mx).getUTCFullYear()+1;
  const single=y1-y0<=1;mn=Date.UTC(y0,0,1);mx=Date.UTC(y1,0,1);const X=t=>(t-mn)/(mx-mn)*100;let ticks="",lines="";
  if(single){for(let m=0;m<12;m++){const t=Date.UTC(y0,m,1);ticks+='<span style="left:'+X(t)+'%">'+MONS[m]+'</span>';lines+='<span class="mt" style="left:'+X(t)+'%"></span>'}}
  else for(let y=y0;y<y1;y++){ticks+='<span style="left:'+X(Date.UTC(y,0,1))+'%">'+y+'</span>';lines+='<span class="mt" style="left:'+X(Date.UTC(y,0,1))+'%"></span>'}
  const now=Date.now(),today=now>mn&&now<mx?'<span class="today" style="left:'+X(now)+'%" data-tip="Today"></span>':"";
  let h='<div class="gantt"><div class="grow2 ghead"><span class="hint">'+plural(rows.length,"intake","intakes")+'</span><div class="gtrack">'+ticks+'</div></div>';
  rows.forEach(r=>{h+='<div class="grow2"><span class="gl2">'+esc(r.x.label+(r.x.c?" ●":""))+'</span><div class="gtrack">'+lines+today+'<span class="gb click" '+intakeAct(r.x)+' style="left:'+X(r.a)+'%;width:'+Math.max(.8,X(r.e)-X(r.a))+'%;background:var('+(r.x.c?SME_COL(r.x.id):CAT[r.i%6])+')" data-tip="'+esc(r.x.label+"\n"+hFmt(r.x.start)+" – "+hFmt(r.x.end)+"\n"+r.x.n+" participants")+'"></span></div></div>'});
  return h+'</div>';
}

function searchIndex(){

  const items=Object.values(people).map(p=>({type:"person",p,hay:(p.name+" "+(p.staffId||"")+" "+(p.station||"")+" "+(p.unit||"")+" "+p.recs.map(r=>r._bl).join(" ")).toLowerCase()}));

function readEditor(){const q=S.qEdit;q.title=$("#qe-t").value.trim();q.smeId=$("#qe-s").value;q.quizKey=$("#qe-k")?$("#qe-k").value:"";q.showScore=$("#qe-sc").checked;q.shuffle=$("#qe-sh").checked;
