  document.querySelectorAll("[data-qopt]").forEach(t=>{const [i,j]=t.dataset.qopt.split("|").map(Number);q.questions[i].options[j]=t.value})}
function parsePasted(txt){
  const blocks=String(txt).replace(/\r/g,"").split(/\n\s*\n|(?=\n\s*\d+[\.\)]\s)/).map(b=>b.trim()).filter(Boolean),out=[];
  blocks.forEach(b=>{const lines=b.split("\n").map(l=>l.trim()).filter(Boolean);if(!lines.length)return;
    let text=lines[0].replace(/^(Q?\d+[\.\):]\s*)/i,"");const opts=[];let ans=-1;
    lines.slice(1).forEach(l=>{const am=l.match(/^(answer|jawapan|ans)\s*[:\-]\s*([A-F])/i);if(am){ans=am[2].toUpperCase().charCodeAt(0)-65;return}
      const m=l.match(/^(\*)?\s*\(?([A-Fa-f])[\)\.:]\s*(.+?)(\s*\*)?$/);if(m){if(m[1]||m[4])ans=opts.length;opts.push(m[3].trim())}else if(!opts.length)text+=" "+l});
    if(!opts.length&&/\b(true|false|betul|salah)\b/i.test(b)===false)return;
    if(!opts.length){opts.push("True","False")}
    out.push({id:qid(),type:opts.length===2&&/^(true|betul)$/i.test(opts[0])?"tf":"mcq",text,options:opts,answer:ans<0?null:ans,points:1})});
  return out;
}
function bindEditor(){
  const q=S.qEdit,box=$(".modal");
  $("#qe-s").addEventListener("change",()=>{readEditor();q.quizKey="";drawEditor()});
  box.addEventListener("click",e=>{const t=e.target.closest("[data-qadd],[data-qdel],[data-qmv],[data-qoadd],[data-qodel]");if(!t)return;readEditor();const d=t.dataset;
    if(d.qadd)q.questions.push(d.qadd==="tf"?{id:qid(),type:"tf",text:"",options:["True","False"],answer:null,points:1}:{id:qid(),type:"mcq",text:"",options:["","","",""],answer:null,points:1});
    if(d.qdel!==undefined)q.questions.splice(+d.qdel,1);
    if(d.qmv){const [i,dir]=d.qmv.split("|").map(Number),j=i+dir;[q.questions[i],q.questions[j]]=[q.questions[j],q.questions[i]]}
    if(d.qoadd!==undefined)q.questions[+d.qoadd].options.push("");
    if(d.qodel){const [i,j]=d.qodel.split("|").map(Number),x=q.questions[i];x.options.splice(j,1);if(x.answer===j)x.answer=null;else if(x.answer>j)x.answer--}
    drawEditor();if(d.qadd)setTimeout(()=>{const m=$(".modal");m.scrollTop=m.scrollHeight;const ts=document.querySelectorAll("[data-qtext]");if(ts.length)ts[ts.length-1].focus()},30)});
  box.addEventListener("change",e=>{const a=e.target.dataset.qans;if(a){readEditor();const [i,j]=a.split("|").map(Number);q.questions[i].answer=j;drawEditor()}});
  $("#qePasteBtn").addEventListener("click",()=>{$("#qePaste").hidden=!$("#qePaste").hidden;if(!$("#qePaste").hidden)$("#qe-p").focus()});
  $("#qePasteGo").addEventListener("click",()=>{readEditor();const add=parsePasted($("#qe-p").value);if(!add.length){$("#qePasteMsg").textContent="No questions recognised. Check the format above.";return}q.questions=q.questions.concat(add);drawEditor();toast(plural(add.length,"question","questions")+" added"+(add.some(x=>x.answer==null)?" · mark the missing answers":""))});
  $("#qeSave").addEventListener("click",async()=>{readEditor();const err=$("#qeerr");
    if(!q.title){err.textContent="Give the quiz a title.";return}
    if(!q.questions.length){err.textContent="Add at least one question.";return}
    const bad=q.questions.findIndex(x=>!x.text.trim()||x.answer==null||x.options.some(o=>!String(o).trim()));
    if(bad>=0){err.textContent="Question "+(bad+1)+" needs its text, all options filled and a correct answer.";return}
    if(await saveQuiz(q,"Quiz saved")){closeModal();render()}});
  const del=$("#qeDel");if(del){let armed=false;del.addEventListener("click",async()=>{if(!armed){armed=true;del.textContent="Click again to delete";return}try{await S.db.doc("quizzes/"+q.id).delete();delete S.quizzes[q.id];closeModal();toast("Quiz deleted");render()}catch(e){toast("Could not delete")}})}
}

/* ---------- QUIZ BACKGROUND MUSIC (original, generated in the browser) ---------- */
const MUSIC_STYLES=[["calm","Calm focus","Soft pads, slow"],["upbeat","Upbeat","Light beat and melody"],["lofi","Lo-fi","Mellow chords, soft drums"],["clock","Countdown tick","Ticking clock, gentle pulse"],["own","My own music","Choose an MP3 on this computer"]];
S.music={style:"calm",vol:.5,playing:false,auto:true,file:null,fileName:""};
try{const m=JSON.parse(localStorage.getItem("ga-music")||"{}");if(m.style)S.music.style=m.style;if(m.vol!=null)S.music.vol=m.vol;if(m.auto!=null)S.music.auto=m.auto}catch(e){}
const MU={ctx:null,master:null,timer:null,step:0,next:0,audio:null};
function musicSavePref(){try{localStorage.setItem("ga-music",JSON.stringify({style:S.music.style,vol:S.music.vol,auto:S.music.auto}))}catch(e){}}
function muCtx(){if(!MU.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;MU.ctx=new C();MU.master=MU.ctx.createGain();MU.master.connect(MU.ctx.destination)}if(MU.ctx.state==="suspended")MU.ctx.resume();return MU.ctx}
const mtof=n=>440*Math.pow(2,(n-69)/12);
function muTone(t,freq,dur,type,gain,attack,release){const c=MU.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+(attack||.02));g.gain.setTargetAtTime(0,t+dur,(release||.15));o.connect(g);g.connect(MU.master);o.start(t);o.stop(t+dur+(release||.15)*6)}
function muNoise(t,dur,gain,hp){const c=MU.ctx,len=Math.floor(c.sampleRate*dur),b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
  const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;f.type="highpass";f.frequency.value=hp||6000;g.gain.value=gain;s.connect(f);f.connect(g);g.connect(MU.master);s.start(t)}
function muKick(t,gain){const c=MU.ctx,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(40,t+.18);g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(MU.master);o.start(t);o.stop(t+.32)}
/* chord progressions (MIDI roots + intervals) — original, generic */
const MU_PROG={calm:[[57,[0,4,7,11]],[53,[0,4,7,11]],[60,[0,4,7,9]],[55,[0,4,7,10]]],upbeat:[[60,[0,4,7]],[57,[0,3,7]],[53,[0,4,7]],[55,[0,4,7]]],lofi:[[62,[0,3,7,10]],[55,[0,4,7,10]],[60,[0,4,7,11]],[57,[0,3,7,10]]],clock:[[57,[0,7]],[57,[0,7]],[53,[0,7]],[55,[0,7]]]};
const MU_BPM={calm:66,upbeat:112,lofi:78,clock:60};
function muStep(style,i,t,beat){
  const prog=MU_PROG[style],bar=Math.floor(i/8)%prog.length,[root,iv]=prog[bar],s=i%8;
  if(style==="calm"){if(s===0)iv.forEach(x=>muTone(t,mtof(root+x),beat*7.5,"sine",.05,.8,.9));if(s%2===0&&Math.random()<.55)muTone(t,mtof(root+12+iv[(i/2|0)%iv.length]),beat*1.6,"triangle",.035,.05,.5)}
  else if(style==="upbeat"){if(s===0)iv.forEach(x=>muTone(t,mtof(root+x),beat*3.6,"triangle",.035,.02,.2));if(s===4)iv.forEach(x=>muTone(t,mtof(root+x),beat*3.6,"triangle",.03,.02,.2));
    muTone(t,mtof(root+12+[0,iv[1],iv[2],12,iv[2],iv[1],0,iv[2]][s]),beat*.45,"square",.018,.005,.06);if(s%2===0)muKick(t,.35);if(s%2===1)muNoise(t,.05,.05);if(s===2||s===6)muNoise(t,.15,.07,1800);muTone(t,mtof(root-12),beat*.4,"sine",s%2===0?.09:0,.01,.08)}
  else if(style==="lofi"){if(s===0)iv.forEach(x=>muTone(t+Math.random()*.03,mtof(root+x),beat*7.6,"sine",.045,.15,.6));if(s===0||s===5)muKick(t,.3);if(s===4)muNoise(t,.12,.05,2500);if(s%2===1)muNoise(t,.04,.025);
    if(s===3||s===7)muTone(t,mtof(root+24+iv[(i/4|0)%iv.length]),beat*.9,"triangle",.02,.02,.3);if(s===0)muTone(t,mtof(root-12),beat*3.5,"sine",.08,.03,.3)}
  else if(style==="clock"){muTone(t,s%2===0?2200:1700,.03,"square",.03,.002,.02);if(s===0)iv.forEach(x=>muTone(t,mtof(root+x),beat*7.5,"sine",.035,.4,.8));if(s===0||s===4)muTone(t,mtof(root-12),beat*.6,"sine",.08,.01,.2)}
}
function muSchedule(){const c=MU.ctx;if(!c||!S.music.playing)return;const st=S.music.style,beat=60/MU_BPM[st]/2;
  while(MU.next<c.currentTime+.25){muStep(st,MU.step,MU.next,beat);MU.step++;MU.next+=beat}}
function musicPlay(){
  const m=S.music;musicStop(true);
  if(m.style==="own"){if(!m.file){toast("Choose a music file first");return}MU.audio=new Audio(m.file);MU.audio.loop=true;MU.audio.volume=m.vol;MU.audio.play().catch(()=>toast("This file could not be played"));m.playing=true;musicUI();return}
  const c=muCtx();if(!c){toast("Music is not supported in this browser");return}
  MU.master.gain.cancelScheduledValues(c.currentTime);MU.master.gain.setValueAtTime(0,c.currentTime);MU.master.gain.linearRampToValueAtTime(m.vol*.9,c.currentTime+1.2);
  MU.step=0;MU.next=c.currentTime+.08;m.playing=true;MU.timer=setInterval(muSchedule,60);muSchedule();musicUI();
}
function musicStop(quick){
  const m=S.music;if(MU.timer){clearInterval(MU.timer);MU.timer=null}
  if(MU.ctx&&MU.master){const t=MU.ctx.currentTime;MU.master.gain.cancelScheduledValues(t);MU.master.gain.setValueAtTime(MU.master.gain.value,t);MU.master.gain.linearRampToValueAtTime(0,t+(quick?.05:1.2))}
  if(MU.audio){const a=MU.audio;MU.audio=null;if(quick){a.pause()}else{let v=a.volume;const f=setInterval(()=>{v-=.08;if(v<=0){clearInterval(f);a.pause()}else a.volume=v},90)}}
  m.playing=false;musicUI();
}
function musicSetVol(v){S.music.vol=v;if(MU.audio)MU.audio.volume=v;if(MU.ctx&&MU.master&&S.music.playing){MU.master.gain.cancelScheduledValues(MU.ctx.currentTime);MU.master.gain.setTargetAtTime(v*.9,MU.ctx.currentTime,.1)}musicSavePref()}
function musicPanel(){const m=S.music;
  return '<div class="musicbox" id="musicBox"><div class="mhead"><b>♪ Background music</b><span class="hint">Plays from this computer’s speakers while participants answer</span></div>'+
    '<div class="mstyles">'+MUSIC_STYLES.map(s=>'<button type="button" class="mst'+(m.style===s[0]?" on":"")+'" data-mstyle="'+s[0]+'"><b>'+s[1]+'</b><small>'+(s[0]==="own"&&m.fileName?esc(m.fileName):s[2])+'</small></button>').join("")+'</div>'+
    '<input type="file" id="mFile" accept="audio/*" hidden>'+
    '<div class="mctl"><button type="button" class="btn '+(m.playing?"":"primary")+'" id="mPlay">'+(m.playing?"■ Stop music":"▶ Play music")+'</button>'+
    '<label class="mvol">Volume <input type="range" id="mVol" min="0" max="1" step="0.05" value="'+m.vol+'"></label>'+
    '<label class="chk"><input type="checkbox" id="mAuto"'+(m.auto?" checked":"")+'> Start when I open the quiz, stop when I close it</label></div></div>';
}
function musicUI(){const b=$("#musicBox");if(b){const w=document.createElement("div");w.innerHTML=musicPanel();b.replaceWith(w.firstChild);bindMusic()}musicFloat()}
function musicFloat(){let f=$("#musicFloat");const show=S.music.playing&&!$("#musicBox");
  if(show&&!f){f=document.createElement("button");f.id="musicFloat";f.className="musicfloat";f.type="button";f.textContent="♪ Music playing · Stop";f.addEventListener("click",()=>musicStop());document.body.appendChild(f)}
  if(!show&&f)f.remove()}
setInterval(musicFloat,1000);
function bindMusic(){
  document.querySelectorAll("[data-mstyle]").forEach(b=>b.addEventListener("click",()=>{const st=b.dataset.mstyle;
    if(st==="own"){$("#mFile").click();return}S.music.style=st;musicSavePref();if(S.music.playing)musicPlay();else musicUI()}));
  const f=$("#mFile");if(f)f.addEventListener("change",()=>{const x=f.files[0];if(!x)return;if(S.music.file)URL.revokeObjectURL(S.music.file);S.music.file=URL.createObjectURL(x);S.music.fileName=x.name;S.music.style="own";musicPlay()});
  const p=$("#mPlay");if(p)p.addEventListener("click",()=>{S.music.playing?musicStop():musicPlay()});
  const v=$("#mVol");if(v)v.addEventListener("input",()=>musicSetVol(+v.value));
  const a=$("#mAuto");if(a)a.addEventListener("change",()=>{S.music.auto=a.checked;musicSavePref()});
}

const PHASES=[["pre","Pre-quiz","Before the session — a baseline. Not saved to the SME."],["post","Post-quiz","After the session — this score goes to the SME."]];
const qphLabel=p=>p==="pre"?"Pre-quiz":"Post-quiz";
const rPhase=r=>r.phase==="pre"?"pre":"post";
S.qPhaseView=null;S.qRunPhase={};
function qBest(q,phase){const c=S.cohorts[q.smeId],R=(S.qResp[q.id]||[]).filter(r=>rPhase(r)===phase),best={};
  R.forEach(r=>{const p=matchParticipant(c,r),k=p?p.id:(r.staffId?"s"+String(r.staffId).replace(/\D/g,""):"x"+String(r.name||"").toLowerCase().replace(/[^a-z]/g,""));if(!best[k]||String(r.submittedAt)<String(best[k].r.submittedAt))best[k]={r,p,k}});
  return{R,rows:Object.values(best).sort((a,b)=>(b.r.pct||0)-(a.r.pct||0)),counted:new Set(Object.values(best).map(x=>x.r.id))}}
const pctTxt=v=>v==null?"–":Math.round(v*100)+"%";
const avgOf=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;

function compareView(q,PRE,POST){
  const c=S.cohorts[q.smeId],Qs=q.questions||[];
  const pre={};PRE.rows.forEach(x=>pre[x.k]=x);const pairs=POST.rows.filter(x=>pre[x.k]).map(x=>({name:x.p?x.p.name:x.r.name,a:pre[x.k].r.pct||0,b:x.r.pct||0}));
  const aPre=avgOf(PRE.rows.map(x=>x.r.pct||0)),aPost=avgOf(POST.rows.map(x=>x.r.pct||0)),up=pairs.filter(x=>x.b>x.a).length,gain=avgOf(pairs.map(x=>x.b-x.a));
  let h='<div class="kpis">'+kpiH("Pre-quiz average",pctTxt(aPre),"",PRE.rows.length+" answered","--s5",'<path d="M4 20V10M10 20V4M16 20v-7"/>',aPre)+kpiH("Post-quiz average",pctTxt(aPost),"",POST.rows.length+" answered","--s2",'<path d="M4 20V10M10 20V4M16 20v-7"/>',aPost)+
    kpiH("Average gain",gain==null?"–":(gain>=0?"+":"")+Math.round(gain*100),gain==null?"":" pts",pairs.length+" took both","--good",'<path d="M4 17l6-6 4 4 6-6M14 9h6v6"/>',null)+kpiH("Improved",up,"/"+pairs.length,"Scored higher after the session","--s3",'<circle cx="12" cy="9" r="5"/><path d="M8.5 13l-1.5 8 5-3 5 3-1.5-8"/>',pairs.length?up/pairs.length:null)+'</div>';
  h+='<div class="g2">'+panel("qrCmpQ",{title:"Each question, before and after",tag:"Questions",tagColor:"--s1",sub:"Share who answered correctly — wide light bar = pre-quiz, narrow bar = post-quiz",opts:[["bar","Bar"]],render:()=>'<div class="cmpq">'+Qs.map((x,i)=>{const f=rows=>rows.length?rows.filter(r=>(r.r.answers||{})[x.id]===x.answer).length/rows.length:null,a=f(PRE.rows),b=f(POST.rows);
      return '<div class="cq" data-tip="'+esc(x.text+"\nPre "+pctTxt(a)+" → Post "+pctTxt(b))+'"><span class="ql">Q'+(i+1)+'. '+esc(x.text)+'</span><div class="cb"><i class="pre" style="width:'+((a||0)*100)+'%"></i><i class="post" style="width:'+((b||0)*100)+'%"></i></div><span class="num cv">'+pctTxt(a)+' → <b>'+pctTxt(b)+'</b></span></div>'}).join("")+'<div class="legend"><span><i class="pre"></i>Pre-quiz</span><span><i class="post"></i>Post-quiz</span></div></div>'})+
    panel("qrCmpDist",{title:"Score bands, before and after",tag:"Participants",tagColor:"--s5",sub:"How many participants in each band",opts:[["col","Column"]],render:()=>{const A=bands(PRE.rows.map(x=>x.r.pct||0)),B=bands(POST.rows.map(x=>x.r.pct||0));
      const mx=Math.max(1,...A.map(x=>x.value),...B.map(x=>x.value));return hbars([].concat(...A.map((x,i)=>[{label:x.label.split(" · ")[0]+" · pre",value:x.value,text:x.value,color:"--s5",tip:x.label+" — pre-quiz: "+x.value},{label:x.label.split(" · ")[0]+" · post",value:B[i].value,text:B[i].value,color:"--s2",tip:x.label+" — post-quiz: "+B[i].value}])),{max:mx})}})+'</div>';
  h+='<section class="panel"><div class="ph"><div class="t"><h3>Participant improvement</h3><p>'+pairs.length+' participants took both the pre-quiz and the post-quiz</p></div></div><div class="tblwrap"><table><thead><tr><th>Participant</th><th class="r">Pre</th><th class="r">Post</th><th class="r">Change</th><th style="width:30%"></th></tr></thead><tbody>'+

    (pairs.length?'':'<tr><td colspan="5" class="hint">Nobody has both a pre-quiz and a post-quiz answer yet.</td></tr>')+'</tbody></table></div></section>';
  return h;
}
function bindQuizResult(q){
  document.querySelectorAll("[data-qpv]").forEach(b=>b.addEventListener("click",()=>{if(b.disabled)return;S.qPhaseView=b.dataset.qpv;render()}));

function bindTaker(){
  const q=S.quizzes[S.taker],tk=S.tk;if(!q)return;const ph=S.takerPhase||q.phase||"post";

      if(!cl.exists)await S.db.doc(qPath(q,"claims",cid)).set({phase:ph,key,uid:dev,name,at:now});

  const go=j=>{tk.cur=j;render();window.scrollTo(0,0)};
  document.querySelectorAll("[data-tka]").forEach(b=>b.addEventListener("click",()=>{const [id,j]=b.dataset.tka.split("|");if(tk.ans[id]!=null)return;tk.pick[id]=+j;render()}));

  const nx=$("#tkNext");if(nx)nx.addEventListener("click",()=>{const Qs=q.questions||[],nxt=tk.order.findIndex((ix,j)=>j>tk.cur&&tk.ans[Qs[ix].id]==null);go(nxt>=0?nxt:Math.min(tk.cur+1,Qs.length-1))});
  const sb=$("#tkSubmit");if(sb)sb.addEventListener("click",async()=>{const Qs=q.questions||[];if(Qs.some(x=>tk.ans[x.id]==null)){$("#tkerr2").textContent="Answer every question first.";return}
    sb.disabled=true;sb.textContent="Sending…";
    const max=Qs.reduce((a,x)=>a+(x.points||1),0),score=Qs.reduce((a,x)=>a+(tk.ans[x.id]===x.answer?(x.points||1):0),0),secs=Math.round((Date.now()-(tk.t0||Date.now()))/1000);
    const rid=ph+"_"+tk.dev;
    const resp={name:tk.name,staffId:tk.staffId,pid:tk.pid,answers:tk.ans,score,max,pct:max?score/max:0,phase:ph,secs,key:tk.key,uid:tk.dev,submittedAt:new Date().toISOString()};if(tk.unit)resp.unit=tk.unit;
    let saved=false;try{await S.db.doc(qPath(q,"responses",rid)).set(resp);saved=true}catch(e){}
    const pk="ga-pre-"+q.id+"-"+tk.key;let prePct=null;
    try{if(ph==="pre")localStorage.setItem(pk,String(resp.pct));else{const v=localStorage.getItem(pk);if(v!=null)prePct=+v}}catch(e){}
    Object.assign(tk,{done:true,saved,score,max,secs,prePct,code:rid.slice(-6).toUpperCase()+"-"+score+"/"+max});render();window.scrollTo(0,0)});
}

function fbStats(f){const R=extResp("fb",f.id),items=fbItems(f),avgK=k=>avgOf(R.map(r=>(r.ans||{})[k]).filter(v=>typeof v==="number"));
  const it=items.map(x=>({...x,avg:avgK(x.k),dist:FB_SCALE.map(s=>R.filter(r=>(r.ans||{})[x.k]===s[0]).length)}));
  const norm=v=>v==null?null:(v-1)/2; // 1..3 → 0..1
  const vals=it.filter(x=>x.avg!=null);const overall=vals.length?avgOf(vals.map(x=>norm(x.avg))):null;
  const partAvg=p=>{const v=it.filter(x=>x.part===p&&x.avg!=null);return v.length?avgOf(v.map(x=>norm(x.avg))):null};
  const T=tplOf(f),parts=(T.parts||[]).map(p=>({id:p.id,title:p.title,short:String(p.title||"").replace(/^part\s*\d+\s*[:.\-–]\s*/i,""),perTrainer:!!p.perTrainer,avg:p.perTrainer?(()=>{const v=it.filter(x=>x.part===p.id&&x.avg!=null);return v.length?avgOf(v.map(x=>norm(x.avg))):null})():partAvg(p.id)}));
  const trainers=(f.trainers||[]).filter(Boolean).map((t,ti)=>{const v=it.filter(x=>x.ti===ti&&x.avg!=null);return{name:t,avg:v.length?avgOf(v.map(x=>norm(x.avg))):null}}).filter(t=>t.avg!=null);
  const rec={};R.forEach(r=>{if(r.rec)rec[r.rec]=(rec[r.rec]||0)+1});
  return{R,n:R.length,items:it,overall,parts,trainers,rec,comments:R.filter(r=>r.comment&&r.comment.trim())}}

/* ---------------- BLACK / GREEN BELT selection ---------------- */
// Ranks an SME's participants on their final score, suggests Black Belt for the top share (default 10%)
// and Green Belt for everyone else who completed the programme. An optional AI review writes an executive
// summary per participant. Only anonymous codes and scores are sent to the AI, never names or staff numbers.
S.beltSme="";S.beltDraft={};S.beltBusy=false;S.beltOpen={};S.beltChat={};S.beltAsk=false;S.beltAiDraft={};
const BELTS={black:{label:"Black Belt",cls:"bb"},green:{label:"Green Belt",cls:"gb"},none:{label:"Not completed",cls:"nb"}};
const beltPill=(b,sm)=>'<span class="beltp '+(BELTS[b]||BELTS.none).cls+(sm?" sm":"")+'">'+(b==="black"||b==="green"?'<i></i>':'')+esc((BELTS[b]||BELTS.none).label)+'</span>';
const beltIco='<path d="M4 9h16v4H4z"/><path d="M10 13l-2 7 4-2 4 2-2-7"/>';
function beltCfg(c){return c.belt||{}}
// AI output stays a draft until saved; drafts and unsaved answers are cleared when you leave the page or change SME
function beltAI(c){return S.beltAiDraft[c.id]||beltCfg(c).ai||null}
function beltClear(){S.beltAiDraft={};Object.keys(S.beltChat).forEach(k=>{S.beltChat[k]=(S.beltChat[k]||[]).filter(m=>m.saved)});S.beltErr="";S.beltPending=null}
function beltPct(c){return beltCfg(c).pct||10}
function beltQuota(c,n){return Math.max(1,Math.round(n*beltPct(c)/100))}
function beltRows(c){
  const sk=SKM(c),T=c.trainerTopics||[],PC=c.projectCriteria||[];
  const rows=(c.participants||[]).map(p=>{const r=scoreP(c,p);
    const tr=T.map(t=>[t.module,(p.trainer||{})[t.key]]).filter(x=>typeof x[1]==="number"&&x[1]>0).map(x=>[x[0],x[1]/sk]);
    const pj=PC.map(t=>[t.module,(p.project||{})[t.key]]).filter(x=>typeof x[1]==="number"&&x[1]>0).map(x=>[x[0],x[1]/3]);
    return{p,r,total:r.total,pass:r.pass,att:r.attRate,quiz:r.quizAvg,trainer:r.trainerAvg==null?null:r.trainerAvg/sk,project:r.projectAvg==null?null:r.projectAvg/3,tr,pj}});
  rows.sort((a,b)=>(b.pass-a.pass)||(b.total-a.total)||String(a.p.name).localeCompare(String(b.p.name)));
  rows.forEach((x,i)=>{x.rank=i+1;x.code="P"+String(i+1).padStart(2,"0")});
  const q=beltQuota(c,rows.length);let k=0;
  rows.forEach(x=>{x.rule=!x.pass?"none":(k++<q?"black":"green")});
  const ai=beltAI(c),fin=beltCfg(c).final||{},dr=S.beltDraft[c.id]||{};
  rows.forEach(x=>{x.ai=ai&&ai.items?ai.items[x.p.id]:null;x.sug=x.ai&&x.ai.belt?x.ai.belt:x.rule;x.saved=fin[x.p.id]||null;x.final=dr[x.p.id]||x.saved||null});
  return rows;
}
function beltAvg(rows){const C=rows.filter(x=>x.pass),A=f=>avgOf(C.map(f).filter(v=>v!=null));return{n:C.length,total:A(x=>x.total),att:A(x=>x.att),quiz:A(x=>x.quiz),trainer:A(x=>x.trainer),project:A(x=>x.project)}}
const r2=v=>v==null?null:Math.round(v*100)/100;
// Full SME data for the AI, with people as codes only
function beltData(c,rows){
  const sk=SKM(c),cnt=p=>{const n={P:0,A:0,R:0};Object.values(p.att||{}).forEach(v=>{if(n[v]!=null)n[v]++});return n};
  const av=beltAvg(rows);
  return{sme:c.name||c.id,title:c.title||"",period:c.period||"",passMark:passMark(c),weights:weights(c),blackBeltQuota:beltQuota(c,rows.length),

// names typed by the user → codes (so names never leave the portal); codes in answers → names
function beltCodeMaps(rows){
  const stop=new Set("muhammad mohammad mohamad mohamed mohd muhamad ahmad bin binti bt abdul abd nur noor nor siti syed sharifah wan nik che mat ab".split(" "));
  const tok={};rows.forEach(x=>{String(x.p.name||"").toLowerCase().replace(/[^a-z\s]/g," ").split(/\s+/).filter(w=>w.length>=4&&!stop.has(w)).forEach(w=>{(tok[w]=tok[w]||new Set()).add(x.code)})});
  return{toCode:q=>{let t=String(q);rows.slice().sort((a,b)=>String(b.p.name).length-String(a.p.name).length).forEach(x=>{if(x.p.name)t=t.replace(new RegExp(x.p.name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"ig"),x.code);if(x.p.staffId)t=t.replace(new RegExp("\\b"+x.p.staffId+"\\b","g"),x.code)});
      Object.entries(tok).forEach(([w,set])=>{if(set.size===1)t=t.replace(new RegExp("\\b"+w+"\\b","ig"),[...set][0])});return t},
    byCode:Object.fromEntries(rows.map(x=>[x.code,x]))}
}
function beltMd(t,byCode){
  let h=esc(String(t||"")).replace(/\bP\d{2}\b/g,m=>byCode&&byCode[m]?'<b class="bname" title="'+m+'">'+esc(byCode[m].p.name)+'</b>':m);
  h=h.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  const L=h.split(/\n/);let out="",ul=false;
  L.forEach(l=>{const m=l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);if(m){if(!ul){out+="<ul>";ul=true}out+="<li>"+m[1]+"</li>";return}if(ul){out+="</ul>";ul=false}
    const hd=l.match(/^\s*#{1,4}\s+(.*)/);if(hd){out+="<h4>"+hd[1]+"</h4>";return}if(l.trim())out+="<p>"+l+"</p>"});
  if(ul)out+="</ul>";return out;
}

S.staff=null;S.staffMeta=null;S.staffSub=false;

function loadStaff(cb){
  if(S.staff){if(cb)cb();return}
  if(!S.db){if(cb)cb();return}
  if(cb)(S.staffWait=S.staffWait||[]).push(cb);
  if(S.staffSub)return;S.staffSub=true;
  S.db.collection("staff").onSnapshot(sn=>{const ch=[];let meta=null;
    sn.docs.forEach(d=>{if(!d.exists)return;const v=d.data();if(d.id==="meta")meta=v;else if(/^c\d+$/.test(d.id))ch[+d.id.slice(1)]=(v.rows||[]).map(r=>typeof r==="string"?r.split("\u001f"):r)});
    const n=meta?meta.chunks:ch.length,rows=[];for(let i=0;i<n;i++)(ch[i]||[]).forEach(r=>rows.push(r));
    S.staffMeta=meta;S.staff=rows.map(r=>({staffId:r[0],name:r[1],position:r[2],grade:r[3],department:r[4],unit:r[5],company:r[6],hay:(r[0]+" "+r[1]+" "+r[2]+" "+r[4]+" "+r[5]).toLowerCase()}));
    const w=S.staffWait||[];S.staffWait=[];w.forEach(f=>{try{f()}catch(e){}});
    if(S.current==="__settings"&&S.setTab==="data")safeRender();
  },()=>{S.staff=[];const w=S.staffWait||[];S.staffWait=[];w.forEach(f=>{try{f()}catch(e){}})});
}
function staffFind(q,lim){
  if(!S.staff)return[];const toks=String(q||"").toLowerCase().split(/\s+/).filter(Boolean);if(!toks.length)return[];
  const out=[];for(const s of S.staff){if(toks.every(t=>s.hay.includes(t))){out.push(s);if(out.length>=(lim||12))break}}
  const q0=toks.join(" ");out.sort((a,b)=>(b.staffId===q0)-(a.staffId===q0)||(b.name.toLowerCase().startsWith(q0))-(a.name.toLowerCase().startsWith(q0)));
  return out;
}

async function phPrep_orig(file){

  let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:"from-image"})}catch(e){try{bmp=await createImageBitmap(file)}catch(e2){throw{code:"decode"}}}
  const M=1920,k=Math.min(1,M/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*k),h=Math.round(bmp.height*k);
  const cv=document.createElement("canvas");cv.width=w;cv.height=h;const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,w,h);g.drawImage(bmp,0,0,w,h);
  const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",.86));return{blob,type:"image/jpeg",w,h};
}

    '<div class="err" id="uferr"></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="submit">'+(u?"Save changes":"Create user")+'</button>'+(u&&u.email&&!isSyn(u.email)?'<button class="btn" type="button" id="ufReset">Send password reset e-mail</button>':'')+'<span style="flex:1"></span>'+(u&&!self?'<button class="btn danger" type="button" id="ufDel">'+I.trash+' Remove access</button>':'')+'</div>'+
    (u?'':'<p class="hint">Share the username and temporary password with them privately. They sign in at the portal address and can change the password in Settings → Personal. Without an e-mail, a forgotten password cannot be reset — remove the user and create a new username.</p>')+'</form>';
  openModal(h);
  const sync=()=>{const r=(document.querySelector('input[name="uf-r"]:checked')||{}).value;$("#uf-scope").hidden=r!=="viewer";$("#uf-sl").hidden=(document.querySelector('input[name="uf-sa"]:checked')||{}).value!=="some"};
  document.querySelectorAll('input[name="uf-r"],input[name="uf-sa"]').forEach(x=>x.addEventListener("change",sync));
  $("#uf").addEventListener("submit",async e=>{e.preventDefault();const err=$("#uferr"),btn=e.target.querySelector("button[type=submit]");
    const un0=u?u.username:$("#uf-u").value.trim();
    if(!u&&!/^[A-Za-z0-9._\-]{3,30}$/.test(un0)){err.textContent="Username: 3–30 letters, numbers, dot, dash or underscore.";return}
    if(!u&&U.some(x=>x.username.toLowerCase()===un0.toLowerCase())){err.textContent="That username is already taken.";return}
    const typed=$("#uf-e").value.trim().toLowerCase();
    if(typed&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(typed)){err.textContent="Enter a valid e-mail, or leave it blank.";return}
    const em=(u&&u.email?u.email:(typed||un0.toLowerCase()+"@"+SYN_DOMAIN)).toLowerCase(),pwEl=$("#uf-p"),pw=pwEl?pwEl.value:"",role=self?u.role:(document.querySelector('input[name="uf-r"]:checked')||{}).value;
    if(U.some(x=>x!==u&&x.email&&x.email.toLowerCase()===em)){err.textContent="That e-mail already has access.";return}
    if(pwEl&&pw.length<8){err.textContent="Password needs at least 8 characters.";return}
    const pg=[...document.querySelectorAll('input[name="uf-pg"]:checked')].map(x=>x.value),sa=(document.querySelector('input[name="uf-sa"]:checked')||{}).value,sm=[...document.querySelectorAll('input[name="uf-sm"]:checked')].map(x=>x.value);
    if(role==="viewer"&&!pg.length){err.textContent="Choose at least one page for this viewer.";return}
    if(role==="viewer"&&sa==="some"&&!sm.length){err.textContent="Choose at least one SME, or pick All SMEs.";return}
    const active=u?($("#uf-a")?$("#uf-a").checked:true):true;
    if(u&&u.role==="admin"&&(role!=="admin"||!active)&&U.filter(x=>x!==u&&x.role==="admin"&&x.active!==false).length===0){err.textContent="Keep at least one active admin.";return}
    btn.disabled=true;let note="";
    if(pwEl){try{const r=await FB.createUser(em,pw);if(r==="exists")note=" (this e-mail already had an account — their own password stays)"}catch(x){btn.disabled=false;err.textContent=x&&x.code==="auth/invalid-email"?"That e-mail is not valid.":x&&x.code==="auth/weak-password"?"Choose a stronger password.":"Could not create the sign-in account.";return}}
    const un=un0;
    const rec={...(u||{}),username:un,email:em,displayName:$("#uf-d").value.trim(),role,pages:role==="viewer"?pg:undefined,smes:role==="viewer"?(sa==="some"?sm:"all"):undefined,active,mustChange:$("#uf-mc").checked&&!note};
    delete rec.legacy;delete rec.salt;delete rec.hash;if(!u)rec.createdAt=new Date().toISOString();
    Object.keys(rec).forEach(k=>{if(rec[k]===undefined)delete rec[k]});
    const ok=await saveUsers(d=>{const i=d.users.findIndex(x=>x.username===un);if(i>=0)d.users[i]=rec;else d.users.push(rec)},(u?"Updated user ":"Added user ")+un+" ("+ROLES[role].label+")");
    btn.disabled=false;if(ok){closeModal();toast(u?"User updated":"User "+un+" created"+note);render()}});
  const rs=$("#ufReset");if(rs)rs.addEventListener("click",async()=>{try{await FB.reset(u.email);toast("Password reset e-mail sent to "+u.email)}catch(x){toast("Could not send the reset e-mail")}});
  if(u&&!self){let armed=false;$("#ufDel").addEventListener("click",async()=>{
    if(u.role==="admin"&&U.filter(x=>x.username!==u.username&&x.role==="admin"&&x.active!==false).length===0){$("#uferr").textContent="Keep at least one active admin.";return}
    if(!armed){armed=true;$("#ufDel").textContent="Click again to remove";return}
    if(await saveUsers(d=>{d.users=d.users.filter(x=>x.username!==u.username)},"Removed access for "+(u.email||u.username))){closeModal();toast("Access removed");render()}})}
}
function bindSettings2(){
  bindSettings2_orig();
  const f=$("#pwForm2");if(f){const n=f.cloneNode(true);f.replaceWith(n);n.addEventListener("submit",async e=>{e.preventDefault();const err=$("#p2err"),np=$("#p2-n").value;
    if(np.length<8){err.textContent="New password needs at least 8 characters.";return}if(np!==$("#p2-c").value){err.textContent="The new passwords don’t match.";return}
    try{await FB.changePassword($("#p2-o").value,np)}catch(x){err.textContent=x&&(x.code==="auth/invalid-credential"||x.code==="auth/wrong-password")?"Current password is incorrect.":x&&x.code==="auth/weak-password"?"Choose a stronger password.":"Could not change the password.";return}
    await saveUsers(d=>{const u=d.users.find(x=>x.username===S.me.username);if(u)u.mustChange=false},S.me.username+" changed their password");toast("Password changed");render()})}
  const r=$("#bkFile");if(r)r.addEventListener("change",restoreBackup);
  const rb=$("#bkPick");if(rb)rb.addEventListener("click",()=>$("#bkFile").click());
  const xb=$("#bkAll");if(xb)xb.addEventListener("click",downloadBackup);
}
function portalPane(){
  let h='<section class="panel"><div class="ph"><div class="t"><h3>Portal address</h3><p>Everyone must sign in with an e-mail that an admin has added in Users & access.</p></div></div>'+
    '<div class="field"><label for="pg-qb">Quiz link address (used in QR codes)</label><input id="pg-qb" type="text" value="'+esc(quizBase())+'"><span class="hint">Normally your Firebase address, e.g. https://genco-academy.web.app/</span></div>'+
    '<div style="margin-top:12px"><button class="btn primary" id="pgSave">Save</button></div></section>';
  h+='<section class="panel"><div class="ph"><div class="t"><h3>Backup</h3><p>Download everything once a month and keep it in a safe folder.</p></div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="bkAll">'+I.down+' Full backup (.json)</button>'+ids().map(id=>'<button class="btn" data-expsme="'+esc(id)+'">'+I.down+' '+esc(S.cohorts[id].name||id)+'</button>').join("")+'<button class="btn" id="pgHist">'+I.down+' SME History</button></div></section>';
  if(S.me&&S.me.role==="admin")h+='<section class="panel"><div class="ph"><div class="t"><h3>Restore data</h3><p>Load a full backup file (.json), for example the data moved from the claude.ai portal. Documents in the file replace the ones with the same name.</p></div><div class="a"><button class="btn" id="bkPick">'+I.up+' Choose backup file</button><input type="file" id="bkFile" accept=".json,application/json" hidden></div></div><div id="bkState"></div></section>';
  return h;
}
const BK_COLS=["cohorts","history","config","quizzes","staff","photos"];
async function downloadBackup(){
  const out={format:"genco-academy-backup",version:1,exportedAt:new Date().toISOString(),collections:{}};
  try{for(const c of BK_COLS){out.collections[c]={};await new Promise((ok,no)=>{const un=S.db.collection(c).onSnapshot(sn=>{sn.docs.forEach(d=>{if(d.exists&&!(c==="config"&&d.id==="roles"))out.collections[c][d.id]=d.data()});setTimeout(()=>un&&un(),0);ok()},no)})}}
  catch(e){toast("Could not read all data for the backup");return}
  const dl=await window.claude.use("downloads");dl.save({filename:"Genco_Academy_backup_"+new Date().toISOString().slice(0,10)+".json",data:new Blob([JSON.stringify(out)],{type:"application/json"})});
}
async function restoreBackup(e){
  const f=e.target.files[0];e.target.value="";if(!f)return;const st=$("#bkState");
  let B;try{B=JSON.parse(await f.text())}catch(x){st.innerHTML='<p class="err">This is not a valid backup file.</p>';return}
  if(!B||B.format!=="genco-academy-backup"||!B.collections){st.innerHTML='<p class="err">This file is not a Genco Academy backup.</p>';return}
  const jobs=[];Object.entries(B.collections).forEach(([c,m])=>{if(!BK_COLS.includes(c))return;Object.entries(m||{}).forEach(([id,d])=>{if(c==="config"&&id==="roles")return;jobs.push([c,id,d])})});
  if(!confirm("Restore "+jobs.length+" documents from "+f.name+"? Existing documents with the same name will be replaced."))return;
  let n=0,fail=0;for(const [c,id,d] of jobs){
    if(c==="config"&&id==="users"&&S.me){const me=(d.users||[]).find(x=>x.email&&x.email.toLowerCase()===FB.email);if(!me){const a=(d.users||[]).find(x=>x.role==="admin"&&!x.email);if(a)a.email=FB.email}}
    try{await S.db.doc(c+"/"+id).set(d);n++}catch(x){fail++}st.innerHTML='<p class="hint"><span class="spin"></span> Restoring '+n+' of '+jobs.length+'…</p>'}
  st.innerHTML='<p class="'+(fail?"err":"hint")+'">'+n+' documents restored'+(fail?', '+fail+' failed':'')+'.</p>';
  if(B.collections.config&&B.collections.config.users){await saveUsers(()=>{},"Restored data from "+f.name)}
  toast("Restore finished");setTimeout(()=>location.reload(),1200);
}

boot();
})();

</script>
